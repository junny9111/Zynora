<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
padding-bottom:110px;
background:
radial-gradient(circle at top,#311146 0%,#12051f 38%,#08080d 72%);
color:white;

}

.topbar{
padding:32px 26px 24px;
background:#0d0d13;

}

.logo{
font-family:"Cinzel",serif;

background:linear-gradient(90deg,#ffffff,#e989ff,#8d2cff);

-webkit-text-fill-color:transparent;

}

.page{
width:100%;
max-width:700px;
margin:auto;
padding:36px 24px;
}

.profile-card{
background:#121119;
border:1px solid rgba(208,84,255,.25);
border-radius:30px;
padding:28px;
text-align:center;
}

.avatar-wrap{
position:relative;
width:110px;
height:110px;
margin:auto;
}

.avatar{
width:110px;
height:110px;
border-radius:50%;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#8c20df,#e04cff);
font-family:Arial,sans-serif;
font-size:42px;
font-weight:900;
box-shadow:0 0 28px rgba(198,66,255,.3);
border:2px solid rgba(223,103,255,.7);
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
display:none;
}

.camera-button{
display:none;
position:absolute;
right:-4px;
bottom:-1px;
width:38px;
height:38px;
border-radius:50%;
border:2px solid #121119;
background:#b134ee;
color:white;
font-size:18px;
cursor:pointer;
}

#profileName{
font-family:"Cinzel",serif;
font-size:30px;
margin-top:18px;
}

#profileEmail{
color:#aaa4af;
font-family:Arial,sans-serif;
margin-top:7px;
word-break:break-word;
}

.edit-button{
margin-top:20px;
padding:13px 28px;
border:1px solid #c84cff;
border-radius:18px;
background:transparent;
color:#df7cff;
font-family:"Cinzel",serif;
font-size:14px;
cursor:pointer;
}

.edit-panel{
margin-top:22px;
padding:22px;
border-radius:22px;
background:#121119;
display:none;
}

.edit-panel input[type="text"]{
width:100%;
padding:16px;
border:1px solid rgba(207,77,255,.35);
border-radius:15px;
background:#09090e;
color:white;
font-family:"Playfair Display",serif;
font-size:17px;
outline:none;
}

.photo-label{
display:block;
margin-top:15px;
padding:16px;
border:1px solid rgba(207,77,255,.35);
border-radius:15px;
text-align:center;
color:#e08aff;
background:#0d0c12;
cursor:pointer;
font-family:"Cinzel",serif;
font-size:12px;
font-weight:bold;
}

#photoInput{
display:none;
}

.save-button{
width:100%;
margin-top:14px;
padding:16px;
border:0;
border-radius:15px;
background:#ac2be5;
color:white;
font-family:"Cinzel",serif;
font-weight:bold;
font-size:13px;
cursor:pointer;
}

.save-button:disabled{
opacity:.5;
cursor:not-allowed;
}

.wallet-card{
margin-top:26px;
padding:27px;
border-radius:30px;
background:
radial-gradient(circle at left,rgba(189,47,255,.55),transparent 60%),
linear-gradient(135deg,#7717c7,#321047);
border:2px solid rgba(224,99,255,.7);
}

.wallet-label{
color:#eee5f4;
font-family:"Cinzel",serif;
font-size:15px;
text-transform:uppercase;
}

.wallet-row{
display:flex;
align-items:center;
gap:15px;
margin-top:14px;
}

.coin-icon{
font-size:52px;
}

#coinBalance{
font-family:"Cinzel",serif;
font-size:60px;
}

.wallet-note{
margin-top:14px;
color:#e3d9e8;
font-family:Arial,sans-serif;
font-size:14px;
}

.buy-button{
width:100%;
margin-top:20px;
padding:18px;
border:none;
border-radius:18px;
background:linear-gradient(90deg,#8d20df,#db47ff);
color:white;
font-family:"Cinzel",serif;
font-weight:bold;
font-size:14px;
cursor:pointer;
}

.section-title{
margin-top:38px;
margin-bottom:18px;
font-family:"Cinzel",serif;
font-size:27px;
text-transform:uppercase;
}

.menu{
overflow:hidden;
background:#121119;
border:1px solid rgba(255,255,255,.08);
border-radius:25px;
}

.menu-item{
width:100%;
padding:21px;
border:0;
border-bottom:1px solid rgba(255,255,255,.07);
background:transparent;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
font-family:"Playfair Display",serif;
font-size:19px;
text-align:left;
cursor:pointer;
}

.menu-item:last-child{
border-bottom:0;
}

.arrow{
color:#b44cff;
}

#status{
margin-top:24px;
padding:17px;
border-radius:18px;
background:#101017;
color:#c2bbc8;
font-family:Arial,sans-serif;
display:none;
line-height:1.5;
}

.login-box{
display:none;
margin-top:25px;
padding:22px;
background:#22131f;
border-radius:20px;
text-align:center;
}

.login-box a{
color:#df67ff;
text-decoration:none;

}


/* ========================================

======================================== */

.bottom-nav{
position:fixed;
left:0;
right:0;
bottom:0;
height:90px;
background:rgba(17,16,22,.98);
display:grid;
grid-template-columns:repeat(6,1fr);
border-top:1px solid rgba(173,77,255,.2);

backdrop-filter:blur(12px);

.nav-item{

flex-direction:column;
align-items:center;
justify-content:center;
gap:5px;
font-family:"Cinzel",serif;

transition:.2s ease;

.nav-icon-wrap{
width:37px;
height:37px;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
transition:.2s ease;
}

.nav-icon-wrap svg{
width:22px;
height:22px;
fill:none;
stroke:currentColor;
stroke-width:1.9;
stroke-linecap:round;
stroke-linejoin:round;

.nav-item.active{
color:#b45cff;
text-shadow:0 0 15px rgba(169,77,255,.5);
}

.nav-item.active .nav-icon-wrap{
background:linear-gradient(
135deg,
rgba(169,77,255,.28),
rgba(116,27,232,.18)

0 0 0 1px rgba(169,77,255,.32),
0 0 18px rgba(169,77,255,.24);

.nav-item:active{

@media(max-width:390px){

.nav-icon-wrap{
width:35px;
height:35px;
}

.nav-icon-wrap svg{
width:21px;
height:21px;
}

}

</style>

<script>

const SUPABASE_URL =
"https://ozshekxpuvganemaajms.supabase.co";

const SUPABASE_KEY =
"sb_publishable__GsW9RahFD_XDWJTFzh9eQ_dNBZfa32";

const AVATAR_BUCKET =
"avatars";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentSession = null;
let selectedPhoto = null;

const coinBalance =
document.getElementById("coinBalance");

const profileName =
document.getElementById("profileName");

const profileEmail =
document.getElementById("profileEmail");

const avatarLetter =
document.getElementById("avatarLetter");

const avatarImage =
document.getElementById("avatarImage");

const statusBox =
document.getElementById("status");

const loginBox =
document.getElementById("loginBox");

const editPanel =
document.getElementById("editPanel");

const nameInput =
document.getElementById("nameInput");

const photoInput =
document.getElementById("photoInput");

const cameraButton =
document.getElementById("cameraButton");

const editButton =
document.getElementById("editButton");

const saveProfileButton =
document.getElementById("saveProfileButton");


/* ========================================
   STATUS
======================================== */

function showStatus(text){

statusBox.style.display =
"block";

statusBox.textContent =
text;

}

function hideStatus(){

statusBox.style.display =
"none";

}


/* ========================================
   AVATAR
======================================== */

function showAvatar(name,photoUrl){

if(photoUrl){

avatarImage.src =
photoUrl;

avatarImage.style.display =
"block";

avatarLetter.style.display =
"none";

}else{

avatarImage.removeAttribute(
"src"
);

avatarImage.style.display =
"none";

avatarLetter.style.display =
"block";

avatarLetter.textContent =
(name || "Z")
.charAt(0)
.toUpperCase();

}

}


/* ========================================
   USER
======================================== */

async function loadUser(){

const {
data,
error
} =
await supabaseClient
.auth
.getSession();

if(error){

showStatus(
"Unable to load your account."
);

return false;

}

currentSession =
data.session;

if(!currentSession){

loginBox.style.display =
"block";

profileEmail.textContent =
"Not logged in";

editButton.disabled =
true;

cameraButton.style.display =
"none";

return false;

}

loginBox.style.display =
"none";

editButton.disabled =
false;

const user =
currentSession.user;

const savedName =
user.user_metadata?.display_name ||
user.user_metadata?.name ||
"Zynora User";

const savedAvatar =
user.user_metadata?.avatar_url ||
"";

profileName.textContent =
savedName;

profileEmail.textContent =
user.email || "";

nameInput.value =
savedName;

showAvatar(
savedName,
savedAvatar
);

return true;

}


/* ========================================
   WALLET
======================================== */

async function loadWallet(){

if(!currentSession){
return;
}

const {
data,
error
} =
await supabaseClient
.from("wallets")
.select("balance")
.eq(
"user_id",
currentSession.user.id
)
.maybeSingle();

if(error){

console.error(
"Wallet error:",
error
);

showStatus(
"Unable to load your Zynora wallet."
);

return;

}

coinBalance.textContent =
Number(
data?.balance || 0
).toLocaleString();

}


/* ========================================
   EDIT PROFILE
======================================== */

editButton.addEventListener(
"click",
()=>{

if(!currentSession){

showStatus(
"Please log in first."
);

return;

}

const isOpen =
editPanel.style.display ===
"block";

if(isOpen){

editPanel.style.display =
"none";

cameraButton.style.display =
"none";

editButton.textContent =
"EDIT PROFILE";

}else{

editPanel.style.display =
"block";

cameraButton.style.display =
"block";

editButton.textContent =
"CLOSE EDIT";

}

}
);


/* ========================================
   CAMERA BUTTON
======================================== */

cameraButton.addEventListener(
"click",
()=>{

if(!currentSession){

showStatus(
"Please log in first."
);

return;

}

photoInput.click();

}
);


/* ========================================
   PHOTO SELECTION
======================================== */

photoInput.addEventListener(
"change",
()=>{

const file =
photoInput.files?.[0];

if(!file){
return;
}

if(!file.type.startsWith("image/")){

showStatus(
"Please choose an image file."
);

photoInput.value =
"";

return;

}

if(file.size > 5 * 1024 * 1024){

showStatus(
"Profile photo must be smaller than 5 MB."
);

photoInput.value =
"";

return;

}

selectedPhoto =
file;

const previewUrl =
URL.createObjectURL(file);

avatarImage.src =
previewUrl;

avatarImage.style.display =
"block";

avatarLetter.style.display =
"none";

showStatus(
"Photo selected. Tap SAVE PROFILE."
);

}
);


/* ========================================
   UPLOAD PROFILE PHOTO
======================================== */

async function uploadProfilePhoto(){

if(!selectedPhoto){

return (
currentSession
?.user
?.user_metadata
?.avatar_url
||
""
);

}

const userId =
currentSession.user.id;

let extension =
selectedPhoto.name
.split(".")
.pop()
.toLowerCase();

if(!extension || extension.length > 5){

extension =
"jpg";

}

const filePath =
`${userId}/profile-${Date.now()}.${extension}`;

const {
error:uploadError
} =
await supabaseClient
.storage
.from(AVATAR_BUCKET)
.upload(
filePath,
selectedPhoto,
{
cacheControl:"3600",
upsert:false
}
);

if(uploadError){

throw uploadError;

}

const {
data
} =
supabaseClient
.storage
.from(AVATAR_BUCKET)
.getPublicUrl(
filePath
);

if(!data || !data.publicUrl){

throw new Error(
"Unable to create profile photo URL."
);

}

return data.publicUrl;

}


/* ========================================
   SAVE PROFILE
======================================== */

saveProfileButton.addEventListener(
"click",
async()=>{

if(!currentSession){

showStatus(
"Please log in first."
);

return;

}

const newName =
nameInput.value.trim();

if(!newName){

showStatus(
"Please enter a name."
);

return;

}

saveProfileButton.disabled =
true;

saveProfileButton.textContent =
"SAVING...";

try{

const avatarUrl =
await uploadProfilePhoto();

const {
data,
error
} =
await supabaseClient
.auth
.updateUser(
{
data:{
display_name:newName,
avatar_url:avatarUrl
}
}
);

if(error){

throw error;

}

profileName.textContent =
newName;

showAvatar(
newName,
avatarUrl
);

if(data?.user){

currentSession.user =
data.user;

}

selectedPhoto =
null;

photoInput.value =
"";

editPanel.style.display =
"none";

cameraButton.style.display =
"none";

editButton.textContent =
"EDIT PROFILE";

showStatus(
"Profile updated successfully."
);

}
catch(error){

console.error(error);

showStatus(
error.message ||
"Unable to update profile."
);

}
finally{

saveProfileButton.disabled =
false;

saveProfileButton.textContent =
"SAVE PROFILE";

}

}
);


/* ========================================
   BUY COINS
======================================== */

document
.getElementById(
"buyCoinsButton"
)
.addEventListener(
"click",
()=>{

window.location.href =
"buy-coins.html";

}
);


/* ========================================
   REWARDS
======================================== */

document
.getElementById(
"rewardsButton"
)
.addEventListener(
"click",
()=>{

window.location.href =
"rewards.html";

}
);


/* ========================================
   LIBRARY
======================================== */

document
.getElementById(
"libraryButton"
)
.addEventListener(
"click",
()=>{

window.location.href =
"library.html";

}
);


/* ========================================
   SETTINGS
======================================== */

document
.getElementById(
"settingsButton"
)
.addEventListener(
"click",
()=>{

showStatus(
"Zynora Settings are coming next."
);

}
);


/* ========================================
   LOG OUT
======================================== */

document
.getElementById(
"logoutButton"
)
.addEventListener(
"click",
async()=>{

await supabaseClient
.auth
.signOut();

window.location.href =
"login.html";

}
);


/* ========================================
   REFRESH
======================================== */

document.addEventListener(
"visibilitychange",
async()=>{

if(
document.visibilityState ===
"visible"
){

const loggedIn =
await loadUser();

if(loggedIn){

await loadWallet();

}

editPanel.style.display =
"none";

cameraButton.style.display =
"none";

editButton.textContent =
"EDIT PROFILE";

}

}
);


/* ========================================
   START PROFILE
======================================== */

async function startProfile(){

const loggedIn =
await loadUser();

if(!loggedIn){
return;
}

await loadWallet();

cameraButton.style.display =
"none";

editPanel.style.display =
"none";

editButton.textContent =
"EDIT PROFILE";

hideStatus();

}

startProfile();

</script>
