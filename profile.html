<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zynora Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background:
        radial-gradient(circle at 50% 25%, rgba(145, 55, 255, 0.12), transparent 30%),
        #08070c;
    color: white;
    font-family: "Playfair Display", Georgia, serif;
    min-height: 100vh;
    padding-bottom: 95px;
}

header {
    height: 140px;
    background: #111016;
    border-bottom: 1px solid rgba(173,77,255,.25);
    display: flex;
    align-items: center;
    padding: 0 28px;
    gap: 20px;
}

.back {
    color: white;
    text-decoration: none;
    font-family: "Cinzel", serif;
    font-size: 42px;
}

.logo {
    font-family: "Cinzel", serif;
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -2px;
    background: linear-gradient(90deg, #ffffff, #d19aff, #8e38ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 25px rgba(155,70,255,.35);
}

.profile {
    text-align: center;
    padding: 55px 25px 30px;
}

.avatar-wrap {
    width: 190px;
    height: 190px;
    margin: 0 auto 28px;
    border-radius: 50%;
    padding: 5px;
    background: linear-gradient(135deg, #c87aff, #6d16e8);
    box-shadow:
        0 0 20px rgba(155,65,255,.7),
        0 0 60px rgba(110,30,230,.35);
}

.avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(135deg,#aa48ff,#6615d8);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
}

.avatar-letter {
    font-family: "Cinzel", serif;
    font-size: 75px;
    font-weight: 700;
}

h1 {
    font-family: "Cinzel", serif;
    font-size: 42px;
    margin-bottom: 8px;
}

.subtitle {
    color: #aaa6b5;
    font-size: 21px;
    font-style: italic;
}

.edit-btn {
    margin-top: 24px;
    border: 1px solid rgba(188,106,255,.55);
    background: linear-gradient(135deg,#a84fff,#7020e5);
    color: white;
    border-radius: 30px;
    padding: 14px 28px;
    font-family: "Cinzel", serif;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(150,50,255,.25);
}

.menu {
    padding: 15px 25px;
}

.card {
    width: 100%;
    background: linear-gradient(145deg,#15141b,#111016);
    border: 1px solid rgba(173,77,255,.18);
    border-radius: 22px;
    padding: 22px;
    margin-bottom: 16px;
    color: white;
    display: flex;
    align-items: center;
    gap: 18px;
    font-family: "Playfair Display", serif;
    font-size: 22px;
    cursor: pointer;
    transition: .2s;
}

.card:active {
    transform: scale(.98);
    background: #1c1824;
}

.icon {
    width: 38px;
    text-align: center;
    font-size: 25px;
}

.settings {
    margin-top: 30px;
}

.logout {
    color: #ff7f9a;
    border-color: rgba(255,70,110,.2);
}

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 92px;
    background: rgba(17,16,22,.98);
    border-top: 1px solid rgba(173,77,255,.2);
    display: grid;
    grid-template-columns: repeat(4,1fr);
    z-index: 10;
}

.nav-item {
    text-decoration: none;
    color: #777582;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-family: "Cinzel", serif;
    font-size: 13px;
}

.nav-icon {
    font-size: 25px;
}

.nav-item.active {
    color: #a94dff;
    text-shadow: 0 0 15px rgba(169,77,255,.5);
}

/* EDIT WINDOW */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.78);
    z-index: 50;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.modal-box {
    width: 100%;
    max-width: 430px;
    background: #15141c;
    border: 1px solid rgba(173,77,255,.45);
    border-radius: 25px;
    padding: 28px;
    box-shadow: 0 0 50px rgba(125,35,220,.35);
}

.modal-box h2 {
    font-family: "Cinzel", serif;
    font-size: 27px;
    margin-bottom: 22px;
}

label {
    display: block;
    color: #b9b4c3;
    margin-bottom: 8px;
    font-family: "Cinzel", serif;
}

input[type="text"] {
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    border: 1px solid #4d3b5f;
    background: #0d0c11;
    color: white;
    font-family: "Playfair Display", serif;
    font-size: 18px;
    margin-bottom: 20px;
}

input[type="file"] {
    width: 100%;
    color: #aaa;
    margin-bottom: 25px;
}

.modal-buttons {
    display: flex;
    gap: 12px;
}

.save-btn,
.cancel-btn {
    flex: 1;
    padding: 14px;
    border-radius: 15px;
    border: none;
    font-family: "Cinzel", serif;
    cursor: pointer;
}

.save-btn {
    background: linear-gradient(135deg,#aa4fff,#711de5);
    color: white;
}

.cancel-btn {
    background: #292630;
    color: white;
}

/* MOBILE */

@media(max-width:600px) {

    header {
        height: 140px;
        padding: 0 22px;
    }

    .logo {
        font-size: 39px;
    }

    .back {
        font-size: 36px;
    }

    .profile {
        padding-top: 45px;
    }

    .avatar-wrap {
        width: 175px;
        height: 175px;
    }

    h1 {
        font-size: 38px;
    }

    .subtitle {
        font-size: 19px;
    }

    .card {
        font-size: 20px;
        padding: 20px;
    }
}

</style>
</head>

<body>

<header>

<a class="back" href="index.html">‹</a>

<div class="logo">Zynora</div>

</header>


<section class="profile">

<div class="avatar-wrap">

<div class="avatar">

<img id="profileImage">

<div class="avatar-letter" id="avatarLetter">Z</div>

</div>

</div>

<h1 id="profileName">My Profile</h1>

<p class="subtitle">Welcome to Zynora</p>

<button class="edit-btn" onclick="openEditor()">
✦ Edit Profile
</button>

</section>


<section class="menu">

<!-- ACCOUNT FIRST -->

<div class="card" onclick="accountMessage()">
<div class="icon">♙</div>
<span>Account</span>
</div>


<div class="card" onclick="helpMessage()">
<div class="icon">?</div>
<span>Help & Support</span>
</div>


<!-- SETTINGS AT THE BOTTOM -->

<div class="card settings" onclick="settingsMessage()">
<div class="icon">⚙</div>
<span>Settings</span>
</div>


<div class="card logout" onclick="logoutMessage()">
<div class="icon">↪</div>
<span>Log Out</span>
</div>

</section>


<!-- BOTTOM NAVIGATION -->

<nav class="bottom-nav">

<a class="nav-item" href="index.html">
<div class="nav-icon">⌂</div>
<div>Home</div>
</a>

<a class="nav-item" href="discover.html">
<div class="nav-icon">◉</div>
<div>Discover</div>
</a>

<a class="nav-item" href="library.html">
<div class="nav-icon">□</div>
<div>Library</div>
</a>

<a class="nav-item active" href="profile.html">
<div class="nav-icon">●</div>
<div>Profile</div>
</a>

</nav>


<!-- EDIT PROFILE MODAL -->

<div class="modal" id="editModal">

<div class="modal-box">

<h2>Edit Your Profile</h2>

<label>Display Name</label>

<input
type="text"
id="nameInput"
placeholder="Enter your name"
>

<label>Profile Picture</label>

<input
type="file"
id="imageInput"
accept="image/*"
>

<div class="modal-buttons">

<button class="cancel-btn" onclick="closeEditor()">
Cancel
</button>

<button class="save-btn" onclick="saveProfile()">
Save Profile
</button>

</div>

</div>

</div>


<script>

const nameElement = document.getElementById("profileName");
const imageElement = document.getElementById("profileImage");
const letterElement = document.getElementById("avatarLetter");


// LOAD SAVED PROFILE

const savedName = localStorage.getItem("zynoraName");
const savedImage = localStorage.getItem("zynoraProfileImage");

if (savedName) {
    nameElement.textContent = savedName;
}

if (savedImage) {

    imageElement.src = savedImage;
    imageElement.style.display = "block";
    letterElement.style.display = "none";

}


// OPEN EDITOR

function openEditor() {

    document.getElementById("editModal").style.display = "flex";

    document.getElementById("nameInput").value =
        localStorage.getItem("zynoraName") || "";

}


// CLOSE EDITOR

function closeEditor() {

    document.getElementById("editModal").style.display = "none";

}


// SAVE PROFILE

function saveProfile() {

    const name =
        document.getElementById("nameInput").value.trim();

    const file =
        document.getElementById("imageInput").files[0];


    if (name) {

        localStorage.setItem("zynoraName", name);

        nameElement.textContent = name;

    }


    if (file) {

        const reader = new FileReader();

        reader.onload = function(event) {

            localStorage.setItem(
                "zynoraProfileImage",
                event.target.result
            );

            imageElement.src = event.target.result;

            imageElement.style.display = "block";

            letterElement.style.display = "none";

        };

        reader.readAsDataURL(file);

    }


    closeEditor();

}


// ACCOUNT

function accountMessage() {

    alert("Zynora Account\n\nYour account information will appear here.");

}


// HELP

function helpMessage() {

    alert("Zynora Help & Support\n\nHow can we help you?");

}


// SETTINGS

function settingsMessage() {

    alert("Zynora Settings\n\nSettings panel coming next.");

}


// LOGOUT

function logoutMessage() {

    const confirmLogout =
        confirm("Do you want to log out of Zynora?");

    if (confirmLogout) {

        localStorage.removeItem("zynoraName");
        localStorage.removeItem("zynoraProfileImage");

        window.location.href = "index.html";

    }

}

</script>

</body>
</html>
