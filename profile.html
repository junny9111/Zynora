<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Zynora Profile</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap"
rel="stylesheet">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
background:
radial-gradient(circle at 50% 10%,rgba(145,55,255,.18),transparent 34%),
#08070c;
color:white;
font-family:"Playfair Display",Georgia,serif;
padding-bottom:105px;
}

header{
height:95px;
display:flex;
align-items:center;
padding:0 22px;
background:#111016;
border-bottom:1px solid rgba(173,77,255,.25);
}

.logo{
font-family:"Cinzel",serif;
font-size:38px;
font-weight:700;
letter-spacing:-2px;
background:linear-gradient(90deg,#fff,#d19aff,#8e38ff);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
text-shadow:0 0 25px rgba(155,70,255,.35);
}

main{
max-width:650px;
margin:auto;
padding:28px 20px 35px;
}

.account-card{
background:
linear-gradient(135deg,rgba(117,35,200,.25),rgba(40,25,70,.45));
border:1px solid rgba(173,77,255,.25);
border-radius:22px;
padding:18px;
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:32px;
cursor:pointer;
}

.account-left{
display:flex;
align-items:center;
gap:13px;
}

.account-icon{
width:46px;
height:46px;
border-radius:50%;
background:linear-gradient(135deg,#a84fff,#7521e4);
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
}

.account-title{
font-family:"Cinzel",serif;
font-size:16px;
}

.account-status{
color:#9994a2;
font-size:12px;
margin-top:4px;
}

.account-arrow{
color:#a94dff;
font-size:26px;
}

.profile{
text-align:center;
}

.avatar-wrapper{
position:relative;
width:145px;
height:145px;
margin:0 auto 22px;
}

.avatar{
width:145px;
height:145px;
border-radius:50%;
object-fit:cover;
background:linear-gradient(135deg,#a84fff,#7521e4);
border:3px solid rgba(190,120,255,.8);
box-shadow:0 0 35px rgba(140,50,255,.45);
}

.default-letter{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
font-family:"Cinzel",serif;
font-size:62px;
font-weight:700;
pointer-events:none;
}

.profile h1{
font-family:"Cinzel",serif;
font-size:34px;
margin-bottom:7px;
}

.welcome{
color:#9994a2;
font-style:italic;
font-size:17px;
}

.edit-btn{
margin-top:20px;
padding:13px 25px;
border:1px solid rgba(173,77,255,.5);
border-radius:18px;
background:linear-gradient(135deg,rgba(168,79,255,.3),rgba(117,33,228,.25));
color:white;
font-family:"Cinzel",serif;
font-size:13px;
font-weight:600;
cursor:pointer;
}

.coin-card{
margin-top:30px;
padding:20px;
border-radius:21px;
background:linear-gradient(135deg,#201129,#131018);
border:1px solid rgba(173,77,255,.22);
display:flex;
align-items:center;
justify-content:space-between;
box-shadow:0 0 25px rgba(130,40,220,.12);
}

.coin-left{
text-align:left;
}

.coin-title{
font-family:"Cinzel",serif;
font-size:14px;
}

.coin-sub{
color:#9994a2;
font-size:12px;
margin-top:4px;
}
