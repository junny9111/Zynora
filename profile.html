<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Zynora Profile</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap"
rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 12%,
            rgba(145,55,255,.18),
            transparent 32%
        ),
        #08070c;

    color: white;

    font-family:
        "Playfair Display",
        Georgia,
        serif;

    padding-bottom: 110px;

}


/* HEADER */

header {

    height: 95px;

    background: #111016;

    border-bottom:
        1px solid
        rgba(173,77,255,.25);

    display: flex;

    align-items: center;

    padding: 0 22px;

}

.logo {

    font-family:
        "Cinzel",
        serif;

    font-size: 38px;

    font-weight: 700;

    letter-spacing: -2px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #d19aff,
            #8e38ff
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    text-shadow:
        0 0 25px
        rgba(155,70,255,.35);

}


/* MAIN */

main {

    padding:
        25px 20px;

}


/* ACCOUNT TOP */

.account-card {

    background:
        linear-gradient(
            135deg,
            rgba(117,35,200,.25),
            rgba(40,25,70,.45)
        );

    border:
        1px solid
        rgba(173,77,255,.25);

    border-radius: 20px;

    padding: 17px 18px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 30px;

}

.account-left {

    display: flex;

    align-items: center;

    gap: 12px;

}

.account-icon {

    width: 43px;

    height: 43px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #a84fff,
            #7521e4
        );

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 22px;

}

.account-title {

    font-family:
        "Cinzel",
        serif;

    font-size: 16px;

}

.account-status {

    color: #9994a2;

    font-size: 12px;

    margin-top: 3px;

}

.account-arrow {

    color: #a94dff;

    font-size: 22px;

}


/* PROFILE */

.profile {

    text-align: center;

}

.avatar-wrapper {

    position: relative;

    width: 130px;

    height: 130px;

    margin:
        0 auto 20px;

}

.avatar {

    width: 130px;

    height: 130px;

    border-radius: 50%;

    object-fit: cover;

    background:
        linear-gradient(
            135deg,
            #a84fff,
            #7521e4
        );

    border:
        3px solid
        rgba(190,120,255,.8);

    box-shadow:
        0 0 35px
        rgba(140,50,255,.45);

}

.default-letter {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    font-family:
        "Cinzel",
        serif;

    font-size: 60px;

    font-weight: 700;

    pointer-events: none;

}

.profile h1 {

    font-family:
        "Cinzel",
        serif;

    font-size: 34px;

    margin-bottom: 7px;

}

.welcome {

    color: #9994a2;

    font-style: italic;

    font-size: 17px;

}


/* EDIT BUTTON */

.edit-btn {

    margin-top: 20px;

    padding:
        13px 24px;

    border: 1px solid
        rgba(173,77,255,.5);

    border-radius: 18px;

    background:
        rgba(130,45,220,.18);

    color: white;

    font-family:
        "Cinzel",
        serif;

    font-weight: 600;

    font-size: 14px;

}


/* COINS */

.coin-card {

    margin-top: 30px;

    padding: 18px;

    border-radius: 20px;

    background: #121117;

    border:
        1px solid
        rgba(173,77,255,.2);

    display: flex;

    align-items: center;

    justify-content: space-between;

}

.coin-label {

    color: #aaa5b1;

    font-size: 14px;

}

.coin-number {

    color: #ffd95c;

    font-family:
        "Cinzel",
        serif;

    font-size: 21px;

}


/* MENU */

.menu {

    margin-top: 25px;

}

.menu-title {

    font-family:
        "Cinzel",
        serif;

    font-size: 19px;

    margin-bottom: 12px;

}

.menu-item {

    width: 100%;

    border: 1px solid
        rgba(255,255,255,.07);

    background: #15141b;

    color: white;

    border-radius: 20px;

    padding:
        20px 18px;

    margin-bottom: 12px;

    display: flex;

    align-items: center;

    gap: 15px;

    text-align: left;

    font-family:
        "Playfair Display",
        serif;

    font-size: 17px;

}

.menu-icon {

    width: 38px;

    font-size: 22px;

    text-align: center;

}

.menu-arrow {

    margin-left: auto;

    color: #777582;

}


/* SETTINGS */

.settings {

    margin-top: 28px;

    padding: 20px;

    border-radius: 22px;

    background:
        linear-gradient(
            135deg,
            rgba(30,28,38,.95),
            rgba(16,14,22,.95)
        );

    border:
        1px solid
        rgba(173,77,255,.2);

}

.settings h2 {

    font-family:
        "Cinzel",
        serif;

    font-size: 19px;

    margin-bottom: 12px;

}

.setting-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 13px 0;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);

}

.setting-row:last-child {

    border-bottom: none;

}

.setting-name {

    color: #d0ccd6;

}

.toggle {

    width: 46px;

    height: 25px;

    border-radius: 20px;

    background: #302c38;

    position: relative;

}

.toggle::after {

    content: "";

    width: 19px;

    height: 19px;

    border-radius: 50%;

    background: #9994a2;

    position: absolute;

    top: 3px;

    left: 3px;

}


/* EDIT POPUP */

.overlay {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.75);

    z-index: 100;

    align-items: center;

    justify-content: center;

    padding: 20px;

}

.overlay.show {

    display: flex;

}

.popup {

    width: 100%;

    max-width: 400px;

    background: #15141b;

    border:
        1px solid
        rgba(173,77,255,.4);

    border-radius: 25px;

    padding: 25px;

    box-shadow:
        0 0 50px
        rgba(100,30,180,.3);

}

.popup h2 {

    font-family:
        "Cinzel",
        serif;

    font-size: 24px;

    margin-bottom: 20px;

}

.popup label {

    display: block;

    color: #aaa5b1;

    margin-bottom: 8px;

}

.popup input[type="text"] {

    width: 100%;

    padding: 14px;

    border-radius: 14px;

    border:
        1px solid
        #393440;

    background: #0d0c11;

    color: white;

    font-family:
        "Playfair Display",
        serif;

    font-size: 16px;

    outline: none;

    margin-bottom: 18px;

}

.photo-label {

    display: block;

    padding: 14px;

    text-align: center;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #a84fff,
            #7521e4
        );

    font-family:
        "Cinzel",
        serif;

    margin-bottom: 20px;

}

#photoInput {

    display: none;

}

.popup-buttons {

    display: flex;

    gap: 10px;

}

.popup-buttons button {

    flex: 1;

    padding: 14px;

    border-radius: 15px;

    font-family:
        "Cinzel",
        serif;

    font-weight: 600;

}

.cancel {

    background: #24212a;

    color: white;

    border: 1px solid #393440;

}

.save {

    background:
        linear-gradient(
            135deg,
            #a84fff,
            #7521e4
        );

    color: white;

    border: none;

}


/* NAVIGATION */

.bottom-nav {

    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    height: 92px;

    background:
        rgba(17,16,22,.98);

    border-top:
        1px solid
        rgba(173,77,255,.2);

    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    z-index: 50;

}

.nav-item {

    text-decoration: none;

    color: #777582;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 7px;

    font-family:
        "Cinzel",
        serif;

    font-size: 12px;

}

.nav-icon {

    font-size: 25px;

}

.nav-item.active {

    color: #a94dff;

    text-shadow:
        0 0 15px
        rgba(169,77,255,.5);

}

</style>

</head>


<body>


<header>

<div class="logo">
Zynora
</div>

</header>


<main>


<!-- ACCOUNT AT TOP -->

<div class="account-card">

<div class="account-left">

<div class="account-icon">
👤
</div>

<div>

<div class="account-title">
Account
</div>

<div class="account-status">
Manage your Zynora account
</div>

</div>

</div>

<div class="account-arrow">
›
</div>

</div>


<!-- PROFILE -->

<div class="profile">


<div class="avatar-wrapper">

<img
id="profileImage"
class="avatar"
style="display:none;"
>

<div
id="defaultLetter"
class="default-letter">
Z
</div>

</div>


<h1 id="displayName">
My Profile
</h1>

<p class="welcome">
Welcome to Zynora
</p>


<button
class="edit-btn"
onclick="openEditor()">

✎ Edit Profile

</button>

</div>


<!-- COINS -->

<div class="coin-card">

<div class="coin-label">
Zynora Coins
</div>

<div class="coin-number">
🪙 <span id="coinBalance">100</span>
</div>

</div>


<!-- MENU -->

<div class="menu">

<div class="menu-title">
Your Zynora
</div>


<button
class="menu-item"
onclick="showMessage('Settings')">

<div class="menu-icon">
⚙
</div>

<div>
Settings
</div>

<div class="menu-arrow">
›
</div>

</button>


<button
class="menu-item"
onclick="showMessage('Help & Support')">

<div class="menu-icon">
?
</div>

<div>
Help & Support
</div>

<div class="menu-arrow">
›
</div>

</button>


</div>


<!-- SETTINGS AT BOTTOM -->

<div class="settings">

<h2>
Settings
</h2>

<div class="setting-row">

<div class="setting-name">
Notifications
</div>

<div class="toggle"></div>

</div>


<div class="setting-row">

<div class="setting-name">
Auto Play
</div>

<div class="toggle"></div>

</div>


<div class="setting-row">

<div class="setting-name">
Video Quality
</div>

<div>
Auto
</div>

</div>

</div>


</main>


<!-- EDIT PROFILE POPUP -->

<div
id="editor"
class="overlay">

<div class="popup">

<h2>
Edit Profile
</h2>


<label>
Display Name
</label>

<input
type="text"
id="nameInput"
placeholder="Enter your name"
maxlength="30"
>


<label
for="photoInput"
class="photo-label">

📷 Choose Profile Picture

</label>

<input
type="file"
id="photoInput"
accept="image/*"
>


<div class="popup-buttons">

<button
class="cancel"
onclick="closeEditor()">

Cancel

</button>

<button
class="save"
onclick="saveProfile()">

Save Profile

</button>

</div>

</div>

</div>


<!-- NAVIGATION -->

<nav class="bottom-nav">


<a
href="index.html"
class="nav-item">

<span class="nav-icon">
⌂
</span>

Home

</a>


<a
href="discover.html"
class="nav-item">

<span class="nav-icon">
◉
</span>

Discover

</a>


<a
href="library.html"
class="nav-item">

<span class="nav-icon">
▣
</span>

Library

</a>


<a
href="profile.html"
class="nav-item active">

<span class="nav-icon">
●
</span>

Profile

</a>


</nav>


<script>


/* OPEN EDITOR */

function openEditor() {

    document
        .getElementById("nameInput")
        .value =
        localStorage.getItem("zynoraName")
        || "";

    document
        .getElementById("editor")
        .classList.add("show");

}


/* CLOSE EDITOR */

function closeEditor() {

    document
        .getElementById("editor")
        .classList.remove("show");

}


/* SAVE PROFILE */

function saveProfile() {

    const name =
        document
        .getElementById("nameInput")
        .value
        .trim();

    if (name) {

        localStorage.setItem(
            "zynoraName",
            name
        );

        document
        .getElementById("displayName")
        .textContent = name;

    }


    const file =
        document
        .getElementById("photoInput")
        .files[0];


    if (file) {

        const reader =
            new FileReader();

        reader.onload =
        function(event) {

            const image =
                event.target.result;

            localStorage.setItem(
                "zynoraProfileImage",
                image
            );

            showProfileImage(image);

        };

        reader.readAsDataURL(file);

    }


    closeEditor();

}


/* SHOW PROFILE IMAGE */

function showProfileImage(image) {

    const img =
        document
        .getElementById("profileImage");

    const letter =
        document
        .getElementById("defaultLetter");

    img.src = image;

    img.style.display = "block";

    letter.style.display = "none";

}


/* LOAD PROFILE */

function loadProfile() {

    const savedName =
        localStorage.getItem(
            "zynoraName"
        );

    const savedImage =
        localStorage.getItem(
            "zynoraProfileImage"
        );


    if (savedName) {

        document
        .getElementById("displayName")
        .textContent =
        savedName;

    }


    if (savedImage) {

        showProfileImage(savedImage);

    }

}


/* BUTTON MESSAGES */

function showMessage(title) {

    alert(
        title +
        "\n\nThis Zynora feature is being connected next."
    );

}


loadProfile();

</script>


</body>

</html>
