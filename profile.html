<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Zynora — Profile</title>

<!-- Stylish Zynora font -->
<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap"
      rel="stylesheet">


<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {

    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(117, 38, 190, .16),
            transparent 35%
        ),
        #07070b;

    color: #ffffff;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    padding-bottom: 100px;

}


/* =========================
   HEADER
========================= */

.header {

    height: 82px;

    display: flex;
    align-items: center;

    padding: 0 20px;

    background: #101014;

    border-bottom:
        1px solid
        rgba(180, 95, 255, .25);

}


.back {

    color: white;

    text-decoration: none;

    font-size: 44px;

    line-height: 1;

    margin-right: 16px;

    font-family: Arial, sans-serif;

}


.logo {

    font-family:
        "Playfair Display",
        Georgia,
        serif;

    font-style: italic;

    font-size: 45px;

    font-weight: 700;

    letter-spacing: -2px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #e0b5ff 40%,
            #923cff
        );

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;

    text-shadow:
        0 0 18px
        rgba(157, 78, 255, .45);

}


/* =========================
   MAIN
========================= */

.main {

    max-width: 650px;

    margin: auto;

    padding:
        38px
        20px
        120px;

    text-align: center;

}


/* =========================
   PAGE TITLE
========================= */

.page-title {

    font-family:
        "Playfair Display",
        Georgia,
        serif;

    font-style: italic;

    font-size: 38px;

    margin-bottom: 28px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #d9a8ff,
            #9b42ff
        );

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;

}


/* =========================
   PROFILE PHOTO
========================= */

.profile-area {

    position: relative;

    width: 150px;
    height: 150px;

    margin:
        0 auto
        24px;

}


.avatar {

    width: 150px;
    height: 150px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #bd63ff,
            #7922dc,
            #43108f
        );

    border:
        3px solid
        #b65cff;

    box-shadow:
        0 0 15px #9b35ff,
        0 0 35px
        rgba(155, 53, 255, .5);

}


.avatar img {

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: none;

}


.avatar-letter {

    font-family:
        "Playfair Display",
        Georgia,
        serif;

    font-size: 68px;

    font-style: italic;

    font-weight: 700;

}


/* =========================
   PHOTO EDIT BUTTON
========================= */

.photo-edit {

    position: absolute;

    right: -4px;
    bottom: 4px;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    border:
        2px solid
        #07070b;

    background:
        linear-gradient(
            135deg,
            #b65cff,
            #7b22dc
        );

    color: white;

    font-size: 22px;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 0 18px
        rgba(164, 64, 255, .7);

}


#photoInput {

    display: none;

}


/* =========================
   NAME
========================= */

.name-area {

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 10px;

    margin-bottom: 7px;

}


.name {

    font-family:
        "Playfair Display",
        Georgia,
        serif;

    font-size: 34px;

    font-weight: 700;

}


.name-edit {

    border: none;

    background: transparent;

    color: #b65cff;

    font-size: 21px;

    cursor: pointer;

}


.subtitle {

    color: #9999a5;

    font-size: 20px;

    margin-bottom: 38px;

}


/* =========================
   CARDS
========================= */

.card {

    width: 100%;

    min-height: 76px;

    margin-bottom: 14px;

    padding: 20px;

    border-radius: 18px;

    display: flex;

    align-items: center;

    text-align: left;

    background:
        linear-gradient(
            135deg,
            rgba(28, 28, 37, .96),
            rgba(17, 17, 23, .96)
        );

    border:
        1px solid
        rgba(160, 80, 240, .25);

    color: white;

    cursor: pointer;

    transition:
        transform .2s,
        border .2s,
        box-shadow .2s;

}


.card:hover {

    transform: translateY(-2px);

    border-color:
        rgba(176, 83, 255, .7);

    box-shadow:
        0 0 22px
        rgba(145, 50, 240, .15);

}


.card-icon {

    width: 42px;

    font-family: Arial, sans-serif;

    font-size: 25px;

    color: #b45aff;

}


.card-text {

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size: 23px;

    font-weight: 600;

}


.arrow {

    margin-left: auto;

    color: #a84cff;

    font-family: Arial, sans-serif;

    font-size: 26px;

}


/* =========================
   LOGOUT
========================= */

.logout {

    background:
        rgba(65, 16, 28, .45);

    border-color:
        rgba(255, 58, 112, .3);

}


.logout .card-icon,
.logout .card-text,
.logout .arrow {

    color: #ff5790;

}


/* =========================
   SETTINGS
========================= */

.settings-section {

    margin-top: 28px;

    padding-top: 24px;

    border-top:
        1px solid
        rgba(255,255,255,.08);

}


.settings-title {

    color: #858591;

    font-size: 15px;

    margin-bottom: 12px;

    text-align: left;

    padding-left: 5px;

}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 82px;

    background: #111116;

    border-top:
        1px solid
        rgba(180, 90, 255, .22);

    display: flex;

    justify-content: space-around;

    align-items: center;

    z-index: 100;

}


.nav-item {

    width: 25%;

    text-align: center;

    text-decoration: none;

    color: #777783;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size: 17px;

    font-weight: 600;

}


.nav-icon {

    display: block;

    font-family: Arial, sans-serif;

    font-size: 24px;

    margin-bottom: 3px;

}


.nav-item.active {

    color: #ad4dff;

}


.nav-item.active .nav-icon {

    text-shadow:
        0 0 12px
        rgba(173, 77, 255, .8);

}


/* =========================
   POPUP
========================= */

.overlay {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.82);

    z-index: 500;

    align-items: center;

    justify-content: center;

    padding: 20px;

}


.popup {

    width: 100%;

    max-width: 480px;

    background: #15151c;

    border:
        1px solid
        rgba(173, 77, 255, .5);

    border-radius: 22px;

    padding: 25px;

    box-shadow:
        0 0 45px
        rgba(125, 40, 220, .25);

}


.popup h2 {

    font-family:
        "Playfair Display",
        Georgia,
        serif;

    font-style: italic;

    font-size: 30px;

    margin-bottom: 16px;

    color: #d09
