<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zynora PayPal Checkout Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #28103f, #090910 55%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 100%;
      max-width: 560px;
      padding: 32px 24px;
      border-radius: 28px;
      background: #11111a;
      border: 2px solid rgba(187, 44, 255, 0.25);
      text-align: center;
    }

    .logo {
      font-size: 52px;
      font-weight: 900;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #fff, #d35cff, #8d2cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 {
      margin: 10px 0;
      font-size: 30px;
    }

    .info {
      color: #bcbccc;
      line-height: 1.6;
      margin: 18px 0 28px;
    }

    .package {
      padding: 24px;
      margin-bottom: 28px;
      border-radius: 22px;
      background: #0b0b12;
      border: 1px solid rgba(211, 92, 255, 0.3);
    }

    .coins {
      font-size: 36px;
      font-weight: 900;
      color: #d35cff;
    }

    .price {
      margin-top: 8px;
      font-size: 20px;
      color: #d0d0db;
    }

    #paypal-button-container {
      margin-top: 24px;
      min-height: 50px;
    }

    .status {
      margin-top: 24px;
      padding: 18px;
      border-radius: 18px;
      background: #090910;
      text-align: left;
      word-break: break-word;
    }

    .status strong {
      color: #d35cff;
    }

    pre {
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.5;
      margin: 8px 0 0;
    }
  </style>

  <script
    src="https://www.paypal.com/sdk/js?client-id=BAAkUqT2hoXnVB9x48eX60l-_lxVKQkiwSJY61jaN_D1Icg5bOGmE5mcmuN_H6LhhCaqHGOWoJvZEQSDM4&currency=USD&intent=capture">
  </script>
</head>

<body>

  <div class="card">

    <div class="logo">Zynora</div>

    <h1>PayPal Checkout Test</h1>

    <div class="info">
      Testing Zynora's US Business Sandbox checkout.
    </div>

    <div class="package">
      <div class="coins">🪙 250 Coins</div>
      <div class="price">$4.99 USD</div>
    </div>

    <div id="paypal-button-container"></div>

    <div class="status">
      <strong>Status</strong>
      <pre id="statusText">Loading PayPal button...</pre>
    </div>

  </div>


<script>

const FUNCTION_URL =
  "https://ozshekxpuvganemaajms.supabase.co/functions/v1/zynora-paypal";

const statusText =
  document.getElementById("statusText");


function showStatus(message) {

  if (typeof message === "string") {
    statusText.textContent = message;
  } else {
    statusText.textContent =
      JSON.stringify(message, null, 2);
  }
}


async function createZynoraOrder() {

  showStatus("Creating Zynora PayPal order...");

  const response =
    await fetch(
      FUNCTION_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          action: "create-order",
          packageId: "coins_250"
        })
      }
    );

  const data =
    await response.json();

  if (!response.ok) {

    showStatus({
      error:
        data.error ||
        "Order creation failed.",
      details:
        data
    });

    throw new Error(
      data.error ||
      "Unable to create order."
    );
  }

  if (!data.orderId) {

    showStatus(data);

    throw new Error(
      "No PayPal order ID returned."
    );
  }

  showStatus({
    message:
      "Order created successfully.",
    orderId:
      data.orderId,
    status:
      data.status
  });

  return data.orderId;
}


async function captureZynoraOrder(orderId) {

  showStatus(
    "Payment approved. Capturing payment..."
  );

  const response =
    await fetch(
      FUNCTION_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          action: "capture-order",
          orderId: orderId
        })
      }
    );

  const data =
    await response.json();

  if (!response.ok) {

    showStatus({
      error:
        data.error ||
        "Capture failed.",
      details:
        data
    });

    throw new Error(
      data.error ||
      "Unable to capture payment."
    );
  }

  return data;
}


if (typeof paypal === "undefined") {

  showStatus(
    "PayPal SDK did not load."
  );

} else {

  paypal.Buttons({

    style: {
      layout: "vertical",
      shape: "rect",
      label: "paypal"
    },


    createOrder: async function() {

      return await createZynoraOrder();

    },


    onApprove: async function(data) {

      try {

        const capture =
          await captureZynoraOrder(
            data.orderID
          );

        showStatus({
          message:
            "PAYMENT COMPLETED ✅",

          status:
            capture.status,

          orderId:
            capture.orderId,

          captureId:
            capture.captureId,

          coins:
            capture.coins,

          amount:
            capture.amount,

          currency:
            capture.currency
        });

      } catch (error) {

        showStatus({
          message:
            "Payment was approved but capture failed.",
          error:
            error.message
        });
      }

    },


    onCancel: function(data) {

      showStatus({
        message:
          "Payment cancelled.",
        orderId:
          data.orderID || null
      });

    },


    onError: function(error) {

      showStatus({
        message:
          "PayPal checkout error.",
        error:
          error?.message ||
          String(error)
      });

    }

  })
  .render("#paypal-button-container")
  .then(function() {

    showStatus(
      "PayPal button loaded successfully. Tap it to test."
    );

  })
  .catch(function(error) {

    showStatus({
      message:
        "Could not render PayPal button.",
      error:
        error?.message ||
        String(error)
    });

  });

}

</script>

</body>
</html>
