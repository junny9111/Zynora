  <title>Zynora PayPal SDK Test</title>

      text-align: center;
    }

    .logo {
      font-size: 52px;
      font-weight: 900;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #fff, #d35cff, #8d2cff);

    }

    h1 {

    }

    .coins {
      font-size: 36px;
      font-weight: 900;
      color: #d35cff;
    }

    .price {
      margin-top: 8px;
      font-size: 20px;
      color: #d0d0db;
    }

    #paypal-button {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 18px;
      font-size: 20px;
      font-weight: 800;
      background: #ffc439;
      color: #111;
      cursor: pointer;
      display: none;
    }

    .status {
      margin-top: 24px;
      padding: 18px;
      border-radius: 18px;
      background: #090910;
      text-align: left;
      display: none;
      word-break: break-word;
    }

    .status.show {
      display: block;
    }

    pre {
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>

  <script src="https://www.sandbox.paypal.com/web-sdk/v6/core"></script>
</head>

    <div class="package">

      <div class="price">$4.99 USD</div>
    </div>

    <button id="paypal-button">
      Pay with PayPal
    </button>

    <div id="status" class="status">
      <pre id="statusText"></pre>
    </div>

  </div>
