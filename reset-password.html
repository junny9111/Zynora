<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zynora - Reset Password</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #241238 0%, #0d0715 45%, #050307 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .logo span {
      color: #d65cff;
    }

    .subtitle {
      text-align: center;
      color: #bcaec9;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(16px);
      padding: 28px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }

    h2 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .card-text {
      font-size: 14px;
      color: #bcaec9;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 13px;
      margin: 14px 0 8px;
      color: #ddd1e8;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      outline: none;
      background: rgba(255,255,255,0.07);
      color: white;
      font-size: 16px;
    }

    input:focus {
      border-color: #c457ff;
      box-shadow: 0 0 0 3px rgba(196,87,255,0.12);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg,#b84cff,#6d4cff);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block;
      color: #aaf2c0;
      background: rgba(38,190,92,0.12);
      border: 1px solid rgba(38,190,92,0.25);
    }

    .error {
      display: block;
      color: #ffb0b0;
      background: rgba(255,70,70,0.12);
      border: 1px solid rgba(255,70,70,0.25);
    }

    .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #d65cff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">
      Zyn<span>ora</span>
    </div>

    <p class="subtitle">
      Create a new password for your account.
    </p>

    <section class="card">

      <h2>New password</h2>

      <p class="card-text">
        Enter your new password below.
      </p>

      <form id="passwordForm">

        <label for="password">
          New password
        </label>

        <input
          id="password"
          type="password"
          minlength="6"
          placeholder="Enter new password"
          autocomplete="new-password"
          required
        >

        <label for="confirmPassword">
          Confirm new password
        </label>

        <input
          id="confirmPassword"
          type="password"
          minlength="6"
          placeholder="Enter password again"
          autocomplete="new-password"
          required
        >

        <button id="saveButton" type="submit">
          Save New Password
        </button>

      </form>

      <div id="message" class="message"></div>

      <a class="back" href="login.html">
        Back to Login
      </a>

    </section>

  </main>


<script>

  const SUPABASE_URL =
    "https://ozshekxpuvganemaajms.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable__GsW9RahFD_XDWJTFzh9eQ_dNBZfa32";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  const passwordForm =
    document.getElementById("passwordForm");

  const passwordInput =
    document.getElementById("password");

  const confirmPasswordInput =
    document.getElementById("confirmPassword");

  const saveButton =
    document.getElementById("saveButton");

  const message =
    document.getElementById("message");


  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }


  async function prepareRecoverySession() {

    const hash =
      window.location.hash;

    const params =
      new URLSearchParams(
        window.location.search
      );


    const code =
      params.get("code");


    try {

      if (code) {

        const { error } =
          await supabaseClient.auth
            .exchangeCodeForSession(code);

        if (error) {
          throw error;
        }

      }


      else if (hash) {

        const hashParams =
          new URLSearchParams(
            hash.substring(1)
          );

        const accessToken =
          hashParams.get("access_token");

        const refreshToken =
          hashParams.get("refresh_token");


        if (
          accessToken &&
          refreshToken
        ) {

          const { error } =
            await supabaseClient.auth
              .setSession({
                access_token: accessToken,
                refresh_token: refreshToken
              });

          if (error) {
            throw error;
          }

        }

      }


      const {
        data: {
          session
        }
      } =
        await supabaseClient.auth
          .getSession();


      if (!session) {

        showMessage(
          "This reset link is missing, invalid, or expired. Please request a new password reset link.",
          "error"
        );

        saveButton.disabled = true;

      }

    }

    catch(error) {

      console.error(
        "Recovery session error:",
        error
      );

      showMessage(
        error.message ||
        "We couldn't verify your password reset link. Please request a new one.",
        "error"
      );

      saveButton.disabled = true;

    }

  }


  prepareRecoverySession();


  passwordForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const password =
        passwordInput.value;

      const confirmPassword =
        confirmPasswordInput.value;


      if (password.length < 6) {

        showMessage(
          "Password must contain at least 6 characters.",
          "error"
        );

        return;

      }


      if (password !== confirmPassword) {

        showMessage(
          "The passwords do not match.",
          "error"
        );

        return;

      }


      saveButton.disabled = true;

      saveButton.textContent =
        "Saving...";


      try {

        const {
          data: {
            session
          }
        } =
          await supabaseClient.auth
            .getSession();


        if (!session) {

          throw new Error(
            "Your password reset session has expired. Please request a new reset link."
          );

        }


        const { error } =
          await supabaseClient.auth
            .updateUser({
              password: password
            });


        if (error) {
          throw error;
        }


        showMessage(
          "Password changed successfully! Returning you to login...",
          "success"
        );


        await supabaseClient.auth
          .signOut();


        setTimeout(function() {

          window.location.href =
            "login.html";

        }, 1800);


      }

      catch(error) {

        console.error(
          "Password update error:",
          error
        );


        showMessage(
          error.message ||
          "We couldn't change your password. Please request a new recovery link.",
          "error"
        );


        saveButton.disabled = false;

        saveButton.textContent =
          "Save New Password";

      }

    }
  );

</script>

</body>
</html>
