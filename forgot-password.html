<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Zynora - Forgot Password</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(
          circle at top,
          #241238 0%,
          #0d0715 45%,
          #050307 100%
        );

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .logo span {
      color: #d65cff;
    }

    .subtitle {
      text-align: center;
      color: #bcaec9;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);

      border:
        1px solid rgba(255, 255, 255, 0.1);

      backdrop-filter: blur(16px);

      padding: 28px;
      border-radius: 24px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .card h2 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .card-text {
      font-size: 14px;
      color: #bcaec9;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 8px;
      color: #ddd1e8;
    }

    input {
      width: 100%;
      padding: 15px 16px;

      border-radius: 14px;

      border:
        1px solid rgba(255, 255, 255, 0.12);

      outline: none;

      background:
        rgba(255, 255, 255, 0.07);

      color: white;
      font-size: 16px;
    }

    input:focus {
      border-color: #c457ff;

      box-shadow:
        0 0 0 3px
        rgba(196, 87, 255, 0.12);
    }

    input::placeholder {
      color: #82768c;
    }

    button {
      width: 100%;

      margin-top: 18px;
      padding: 15px;

      border: none;
      border-radius: 14px;

      cursor: pointer;

      font-size: 16px;
      font-weight: 700;

      color: white;

      background:
        linear-gradient(
          135deg,
          #b84cff,
          #6d4cff
        );

      box-shadow:
        0 10px 30px
        rgba(171, 70, 255, 0.28);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;

      margin-top: 18px;
      padding: 13px;

      border-radius: 12px;

      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block;

      color: #aaf2c0;

      background:
        rgba(38, 190, 92, 0.12);

      border:
        1px solid rgba(38, 190, 92, 0.25);
    }

    .error {
      display: block;

      color: #ffb0b0;

      background:
        rgba(255, 70, 70, 0.12);

      border:
        1px solid rgba(255, 70, 70, 0.25);
    }

    .back {
      display: block;

      margin-top: 22px;

      text-align: center;

      color: #d65cff;
      text-decoration: none;

      font-size: 14px;
      font-weight: 600;
    }

    .back:hover {
      text-decoration: underline;
    }

    .help {
      margin-top: 22px;

      text-align: center;

      color: #756b7e;

      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>


<body>

  <main class="container">

    <div class="logo">
      Zyn<span>ora</span>
    </div>

    <p class="subtitle">
      Reset your password and get back to your stories.
    </p>


    <section class="card">

      <h2>Forgot password?</h2>

      <p class="card-text">
        Enter the email address connected to your Zynora account.
        We'll send you a secure password reset link.
      </p>


      <form id="resetForm">

        <label for="email">
          Email address
        </label>

        <input
          id="email"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <button
          id="sendButton"
          type="submit"
        >
          Send Reset Link
        </button>

      </form>


      <div
        id="message"
        class="message"
      ></div>


      <a
        class="back"
        href="login.html"
      >
        ← Back to Login
      </a>

    </section>


    <p class="help">
      For your security, never share your password
      or recovery link with anyone.
    </p>

  </main>


<script>

  /* =========================================
     ZYNORA SUPABASE CONNECTION
     ========================================= */

  const SUPABASE_URL =
    "https://ozshekxpuvganemaajms.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable__GsW9RahFD_XDWJTFzh9eQ_dNBZfa32";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /* =========================================
     ELEMENTS
     ========================================= */

  const resetForm =
    document.getElementById("resetForm");

  const emailInput =
    document.getElementById("email");

  const message =
    document.getElementById("message");

  const sendButton =
    document.getElementById("sendButton");


  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;
  }


  /* =========================================
     PASSWORD RESET
     ========================================= */

  resetForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const email =
        emailInput.value.trim();


      if (!email) {

        showMessage(
          "Please enter your email address.",
          "error"
        );

        return;
      }


      sendButton.disabled = true;

      sendButton.textContent =
        "Sending...";


      try {

        /*
          This creates the correct GitHub Pages URL:

          .../Zynora/reset-password.html
        */

        const redirectUrl =
          new URL(
            "reset-password.html",
            window.location.href
          ).href;


        console.log(
          "Password reset redirect:",
          redirectUrl
        );


        const { error } =
          await supabaseClient.auth
            .resetPasswordForEmail(
              email,
              {
                redirectTo: redirectUrl
              }
            );


        if (error) {
          throw error;
        }


        showMessage(
          "Password reset email sent! Check your inbox and spam folder, then tap the reset link.",
          "success"
        );


        emailInput.value = "";

      }

      catch(error) {

        console.error(
          "Zynora password reset error:",
          error
        );


        showMessage(
          error.message ||
          "We couldn't send the reset email. Please try again.",
          "error"
        );

      }

      finally {

        sendButton.disabled = false;

        sendButton.textContent =
          "Send Reset Link";

      }

    }
  );

</script>

</body>

</html>
