<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zynora</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #09090d;
  color: #ffffff;
  font-family: Arial, sans-serif;
}

header {
  height: 72px;
  background: #111116;
  border-bottom: 1px solid #292933;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 20px;
}

.logo {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -1px;
}

.logo span {
  color: #a855f7;
}

.search {
  width: 45%;
  max-width: 280px;

  background: #1a1a21;
  border: 1px solid #30303a;
  border-radius: 30px;

  padding: 13px 18px;

  color: #aaa;
  font-size: 15px;
}

.hero {
  min-height: 570px;

  padding: 110px 42px 60px;

  background:
    radial-gradient(
      circle at 20% 25%,
      #35105f 0%,
      #160c27 35%,
      #09090d 70%
    );
}

.badge {
  display: inline-block;

  padding: 12px 20px;

  border-radius: 30px;

  background: linear-gradient(
    90deg,
    #a855f7,
    #8b5cf6
  );

  font-weight: bold;
  font-size: 15px;
}

.hero h1 {
  max-width: 600px;

  font-size: 55px;
  line-height: 1.05;

  margin: 28px 0 20px;
}

.hero p {
  max-width: 600px;

  color: #b7b7c2;

  font-size: 19px;
  line-height: 1.6;
}

.watch {
  display: inline-block;

  margin-top: 25px;

  padding: 17px 30px;

  border-radius: 12px;

  background: white;
  color: #09090d;

  text-decoration: none;

  font-size: 17px;
  font-weight: bold;
}

section {
  padding: 35px 38px 110px;
}

section h2 {
  font-size: 30px;
  margin-bottom: 22px;
}

.categories {
  display: flex;
  gap: 12px;

  overflow-x: auto;

  padding-bottom: 10px;
}

.category {
  flex-shrink: 0;

  padding: 14px 24px;

  border-radius: 30px;

  background: #18181f;
  border: 1px solid #30303a;

  color: white;

  cursor: pointer;

  font-size: 15px;
}

.category.active {
  background: #a855f7;
  border-color: #a855f7;
}

.message {
  margin-top: 35px;

  padding: 30px;

  border-radius: 18px;

  background: #13131a;
  border: 1px solid #292933;

  color: #aaa;

  text-align: center;
}

.bottom {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  height: 78px;

  background: #111116;

  border-top: 1px solid #292933;

  display: flex;
  justify-content: space-around;
  align-items: center;

  z-index: 100;
}

.bottom a {
  color: #777783;

  text-decoration: none;

  text-align: center;

  font-size: 12px;
}

.bottom a.active {
  color: #a855f7;
}

.icon {
  display: block;

  font-size: 23px;

  margin-bottom: 5px;
}

@media (max-width: 600px) {

  .hero {
    padding: 80px 42px 50px;
  }

  .hero h1 {
    font-size: 46px;
  }

  .hero p {
    font-size: 17px;
  }

  .search {
    width: 43%;
  }

}
</style>
</head>

<body>

<header>

  <div class="logo">
    Zyn<span>ora</span>
  </div>

  <input
    class="search"
    type="search"
    placeholder="Search..."
    id="searchBox"
  >

</header>


<div class="hero">

  <div class="badge">
    ZYNORA ORIGINAL
  </div>

  <h1>
    The Billionaire's Secret
  </h1>

  <p>
    Discover addictive short dramas, romance,
    suspense and original series made for Zynora.
  </p>

  <a href="#" class="watch" onclick="watchNow()">
    ▶ Watch Now
  </a>

</div>


<section>

  <h2>
    Explore
  </h2>

  <div class="categories">

    <button
      class="category active"
      onclick="selectCategory(this, 'For You')">
      For You
    </button>

    <button
      class="category"
      onclick="selectCategory(this, 'Romance')">
      Romance
    </button>

    <button
      class="category"
      onclick="selectCategory(this, 'Drama')">
      Drama
    </button>

    <button
      class="category"
      onclick="selectCategory(this, 'Action')">
      Action
    </button>

    <button
      class="category"
      onclick="selectCategory(this, 'Suspense')">
      Suspense
    </button>

  </div>


  <div class="message" id="categoryMessage">

    Showing stories recommended for you.

  </div>

</section>


<nav class="bottom">

  <a href="index.html" class="active">

    <span class="icon">⌂</span>

    Home

  </a>


  <a href="#" onclick="discover()">

    <span class="icon">◉</span>

    Discover

  </a>


  <a href="#" onclick="library()">

    <span class="icon">□</span>

    Library

  </a>


  <a href="profile.html">

    <span class="icon">●</span>

    Profile

  </a>

</nav>


<script>

function watchNow() {

  alert(
    "Zynora player is coming next."
  );

}


function selectCategory(button, category) {

  document
    .querySelectorAll(".category")
    .forEach(function(item) {

      item.classList.remove("active");

    });

  button.classList.add("active");

  document.getElementById(
    "categoryMessage"
  ).innerText =
    "Showing " + category +
    " stories on Zynora.";

}


function discover() {

  alert(
    "Discover will be built next."
  );

}


function library() {

  alert(
    "Your Zynora Library will be built next."
  );

}


document
  .getElementById("searchBox")
  .addEventListener("keypress", function(event) {

    if (event.key === "Enter") {

      let value = this.value.trim();

      if (value === "") {

        alert("Type something to search.");

      } else {

        alert(
          "Searching Zynora for: " + value
        );

      }

    }

  });

</script>

</body>
</html>
