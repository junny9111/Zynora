<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zynora - Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #29104b, #09090d 55%);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(17, 17, 22, 0.95);
      border: 1px solid #292933;
      border-radius: 22px;
      padding: 35px 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .logo {
      text-align: center;
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .logo span {
      color: #9b4dff;
    }

    .subtitle {
      text-align: center;
      color: #9999a5;
      margin-bottom: 30px;
    }

    .tabs {
      display: flex;
      background: #15151c;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 25px;
    }

    .tab {
      width: 50%;
      padding: 12px;
      border: none;
      background: transparent;
      color: #9999a5;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab.active {
      background: #9b4dff;
      color: white;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 14px;
      color: #d5d5dc;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #34343e;
      background: #0f0f14;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #9b4dff;
    }

    .submit {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 11px;
      background: #9b4dff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #9999a5;
      text-decoration: none;
      font-size: 14px;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      color: #c9c7d0;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Zyn<span>ora</span>
    </div>

    <p class="subtitle">
      Your world of short dramas.
    </p>

    <div class="tabs">

      <button
        id="loginTab"
        class="tab active"
        onclick="showLogin()">
        Login
      </button>

      <button
        id="signupTab"
        class="tab"
        onclick="showSignup()">
        Sign Up
      </button>

    </div>


    <form id="authForm">

      <div id="nameField" style="display:none;">

        <label for="name">
          Name
        </label>

        <input
          id="name"
          type="text"
          placeholder="Your name"
        >

      </div>


      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        required
      >


      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        required
      >


      <button
        class="submit"
        type="submit">
        Login
      </button>

    </form>


    <div id="message"></div>


    <a href="index.html" class="back">
      ← Continue without an account
    </a>

  </div>


  <script>

    let mode = "login";

    const loginTab =
      document.getElementById("loginTab");

    const signupTab =
      document.getElementById("signupTab");

    const nameField =
      document.getElementById("nameField");

    const submitButton =
      document.querySelector(".submit");

    const message =
      document.getElementById("message");


    function showLogin() {

      mode = "login";

      loginTab.classList.add("active");
      signupTab.classList.remove("active");

      nameField.style.display = "none";

      submitButton.textContent = "Login";

      message.textContent = "";

    }


    function showSignup() {

      mode = "signup";

      signupTab.classList.add("active");
      loginTab.classList.remove("active");

      nameField.style.display = "block";

      submitButton.textContent = "Create Account";

      message.textContent = "";

    }


    document
      .getElementById("authForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        if (mode === "login") {

          message.textContent =
            "Login system will be connected to Supabase next.";

        } else {

          message.textContent =
            "Account creation will be connected to Supabase next.";

        }

      });

  </script>

</body>
</html>
