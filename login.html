<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zynora - Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #29104b, #09090d 55%);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #111116;
      border: 1px solid #292933;
      border-radius: 22px;
      padding: 35px 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .logo {
      text-align: center;
      font-size: 38px;
      font-weight: 800;
    }

    .logo span {
      color: #9b4dff;
    }

    .subtitle {
      text-align: center;
      color: #9999a5;
      margin-bottom: 30px;
    }

    .tabs {
      display: flex;
      background: #15151c;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 25px;
    }

    .tab {
      width: 50%;
      padding: 12px;
      border: none;
      background: transparent;
      color: #9999a5;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab.active {
      background: #9b4dff;
      color: white;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #34343e;
      background: #0f0f14;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #9b4dff;
    }

    .submit {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 11px;
      background: #9b4dff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #9999a5;
      text-decoration: none;
      font-size: 14px;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      color: #c9c7d0;
      font-size: 14px;
      min-height: 20px;
      line-height: 1.4;
    }

    #message.success {
      color: #d8b7ff;
    }

    #message.error {
      color: #ff9b9b;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    Zyn<span>ora</span>
  </div>

  <p class="subtitle">
    Your world of short dramas.
  </p>

  <div class="tabs">

    <button
      id="loginTab"
      class="tab active"
      type="button"
      onclick="showLogin()">
      Login
    </button>

    <button
      id="signupTab"
      class="tab"
      type="button"
      onclick="showSignup()">
      Sign Up
    </button>

  </div>

  <form id="authForm">

    <div id="nameField" style="display:none;">

      <label for="name">Name</label>

      <input
        id="name"
        type="text"
        placeholder="Your name"
        autocomplete="name"
      >

    </div>

    <label for="email">Email</label>

    <input
      id="email"
      type="email"
      placeholder="you@example.com"
      autocomplete="email"
      required
    >

    <label for="password">Password</label>

    <input
      id="password"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      minlength="6"
      required
    >

    <button
      id="submitButton"
      class="submit"
      type="submit">
      Login
    </button>

  </form>

  <div id="message"></div>

  <a href="index.html" class="back">
    ← Continue without an account
  </a>

</div>


<script type="module">

  /* =====================================
     ZYNORA SUPABASE CONNECTION
     ===================================== */

  const SUPABASE_URL =
    "https://ozshekxpuvganemaajms.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable__GsW9RahFD_XDWJTFzh9eQ_dNBZfa32";


  /* =====================================
     LOAD SUPABASE
     ===================================== */

  import {
    createClient
  } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


  const supabase =
    createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let mode = "login";


  const loginTab =
    document.getElementById("loginTab");

  const signupTab =
    document.getElementById("signupTab");

  const nameField =
    document.getElementById("nameField");

  const nameInput =
    document.getElementById("name");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const submitButton =
    document.getElementById("submitButton");

  const message =
    document.getElementById("message");


  function setMessage(text, type = "") {

    message.textContent = text;

    message.className = type;

  }


  function setLoading(isLoading) {

    submitButton.disabled = isLoading;

    if (isLoading) {

      submitButton.textContent =
        mode === "signup"
          ? "Creating Account..."
          : "Logging In...";

    }

    else {

      submitButton.textContent =
        mode === "signup"
          ? "Create Account"
          : "Login";

    }

  }


  /* =====================================
     LOGIN MODE
     ===================================== */

  function showLogin() {

    mode = "login";

    loginTab.classList.add("active");
    signupTab.classList.remove("active");

    nameField.style.display = "none";

    nameInput.required = false;

    passwordInput.autocomplete =
      "current-password";

    submitButton.textContent =
      "Login";

    setMessage("");

  }


  /* =====================================
     SIGN UP MODE
     ===================================== */

  function showSignup() {

    mode = "signup";

    signupTab.classList.add("active");
    loginTab.classList.remove("active");

    nameField.style.display = "block";

    nameInput.required = true;

    passwordInput.autocomplete =
      "new-password";

    submitButton.textContent =
      "Create Account";

    setMessage("");

  }


  window.showLogin = showLogin;
  window.showSignup = showSignup;


  /* =====================================
     AUTHENTICATION
     ===================================== */

  document
    .getElementById("authForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        setLoading(true);
        setMessage("Please wait...");

        const name =
          nameInput.value.trim();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        try {

          /* =====================================
             SIGN UP
             ===================================== */

          if (mode === "signup") {

            const {
              data,
              error
            } = await supabase.auth.signUp({

              email: email,

              password: password,

              options: {

                data: {
                  display_name: name
                }

              }

            });


            if (error) {
              throw error;
            }


            /*
              If email confirmation is enabled,
              Supabase usually creates the user
              but does not create a live session yet.
            */

            if (!data.session) {

              localStorage.setItem(
                "zynora_pending_signup",
                "true"
              );

              setMessage(
                "Account created! Check your email and verify your Zynora account. Then return here and log in.",
                "success"
              );

              showLogin();

              emailInput.value = email;

              return;

            }


            /*
              If Supabase automatically creates
              a session, signup is already complete.
            */

            localStorage.setItem(
              "zynora_signup_success_seen",
              "true"
            );

            window.location.href =
              "signup-success.html";

          }


          /* =====================================
             LOGIN
             ===================================== */

          else {

            const {
              data,
              error
            } =
              await supabase.auth.signInWithPassword({

                email: email,
                password: password

              });


            if (error) {
              throw error;
            }


            const user =
              data.user;


            if (!user) {

              throw new Error(
                "Unable to verify your account."
              );

            }


            /*
              Check whether this login belongs
              to a newly created account.
            */

            const pendingSignup =
              localStorage.getItem(
                "zynora_pending_signup"
              );


            const successAlreadySeen =
              localStorage.getItem(
                "zynora_signup_success_seen"
              );


            if (
              pendingSignup === "true" &&
              successAlreadySeen !== "true"
            ) {

              localStorage.removeItem(
                "zynora_pending_signup"
              );

              localStorage.setItem(
                "zynora_signup_success_seen",
                "true"
              );

              setMessage(
                "Account verified! Welcome to Zynora.",
                "success"
              );


              setTimeout(function() {

                window.location.href =
                  "signup-success.html";

              }, 700);

            }

            else {

              setMessage(
                "Login successful!",
                "success"
              );


              setTimeout(function() {

                window.location.href =
                  "index.html";

              }, 700);

            }

          }

        }

        catch (error) {

          console.error(error);

          setMessage(
            error.message ||
            "Something went wrong. Please try again.",
            "error"
          );

        }

        finally {

          setLoading(false);

        }

      }
    );

</script>

</body>
</html>
