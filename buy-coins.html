<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zynora Buy Coins</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #2a103f, #090910 55%);
      color: #fff;
      padding: 24px;
    }

    .wrap {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }

    .logo {
      text-align: center;
      font-size: 48px;
      font-weight: 900;
      margin: 12px 0 6px;
      background: linear-gradient(90deg, #fff, #d35cff, #8d2cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #b8b8c8;
      margin-bottom: 28px;
    }

    .balance-card {
      background: #11111a;
      border: 1px solid rgba(211, 92, 255, 0.35);
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 26px;
      text-align: center;
    }

    .balance-label {
      color: #aaa9b8;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .balance-value {
      font-size: 38px;
      font-weight: 900;
      color: #d35cff;
    }

    .package-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .package {
      background: #11111a;
      border: 2px solid transparent;
      border-radius: 22px;
      padding: 22px 16px;
      cursor: pointer;
      text-align: center;
      transition: 0.2s ease;
    }

    .package.active {
      border-color: #d35cff;
      transform: translateY(-2px);
    }

    .package .coins {
      font-size: 26px;
      font-weight: 900;
      color: #d35cff;
    }

    .package .price {
      margin-top: 8px;
      color: #d0d0db;
      font-size: 18px;
    }

    .summary {
      margin-top: 24px;
      padding: 20px;
      border-radius: 20px;
      background: #11111a;
      border: 1px solid rgba(211, 92, 255, 0.25);
      text-align: center;
    }

    .summary strong {
      color: #d35cff;
    }

    #paypal-button-container {
      margin-top: 24px;
      min-height: 50px;
    }

    .status {
      margin-top: 22px;
      padding: 18px;
      background: #0c0c13;
      border-radius: 18px;
      color: #d6d6df;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.5;
    }

    .login-warning {
      margin-top: 20px;
      padding: 18px;
      border-radius: 18px;
      background: #21131f;
      border: 1px solid rgba(255, 90, 90, 0.35);
      text-align: center;
      display: none;
    }

    .login-warning a {
      color: #d35cff;
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-width: 520px) {
      .package-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script
    src="https://www.paypal.com/sdk/js?client-id=BAAkUqT2hoXnVB9x48eX60l-_lxVKQkiwSJY61jaN_D1Icg5bOGmE5mcmuN_H6LhhCaqHGOWoJvZEQSDM4&currency=USD&intent=capture">
  </script>
</head>

<body>

  <div class="wrap">

    <div class="logo">Zynora</div>
    <div class="subtitle">Buy Zynora Coins</div>

    <div class="balance-card">
      <div class="balance-label">Your Coin Balance</div>
      <div class="balance-value" id="balanceValue">0</div>
    </div>

    <div class="package-grid">

      <div
        class="package active"
        data-package="coins_250"
        data-coins="250"
        data-price="4.99">
        <div class="coins">🪙 250</div>
        <div class="price">$4.99 USD</div>
      </div>

      <div
        class="package"
        data-package="coins_500"
        data-coins="500"
        data-price="9.99">
        <div class="coins">🪙 500</div>
        <div class="price">$9.99 USD</div>
      </div>

      <div
        class="package"
        data-package="coins_1200"
        data-coins="1200"
        data-price="19.99">
        <div class="coins">🪙 1,200</div>
        <div class="price">$19.99 USD</div>
      </div>

      <div
        class="package"
        data-package="coins_3000"
        data-coins="3000"
        data-price="29.99">
        <div class="coins">🪙 3,000</div>
        <div class="price">$29.99 USD</div>
      </div>

    </div>

    <div class="summary">
      Selected:
      <strong id="selectedCoins">250 Coins</strong>
      for
      <strong id="selectedPrice">$4.99 USD</strong>
    </div>

    <div id="paypal-button-container"></div>

    <div class="login-warning" id="loginWarning">
      You must be logged in to buy coins.
      <br /><br />
      <a href="login.html">Go to Login</a>
    </div>

    <div class="status" id="statusBox">
      Loading your Zynora account...
    </div>

  </div>


<script>

const SUPABASE_URL =
  "https://ozshekxpuvganemaajms.supabase.co";

const SUPABASE_KEY =
  "sb_publishable__GsW9RahFD_XDWJTFzh9eQ_dNBZfa32";

const FUNCTION_URL =
  "https://ozshekxpuvganemaajms.supabase.co/functions/v1/zynora-paypal";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let selectedPackage =
  "coins_250";

let selectedCoins =
  250;

let selectedPrice =
  "4.99";

let currentSession =
  null;


const packageCards =
  document.querySelectorAll(".package");

const selectedCoinsText =
  document.getElementById("selectedCoins");

const selectedPriceText =
  document.getElementById("selectedPrice");

const balanceValue =
  document.getElementById("balanceValue");

const statusBox =
  document.getElementById("statusBox");

const loginWarning =
  document.getElementById("loginWarning");


function showStatus(message) {

  if (typeof message === "string") {
    statusBox.textContent = message;
  } else {
    statusBox.textContent =
      JSON.stringify(message, null, 2);
  }
}


/* ============================================================
   PACKAGE SELECTION
============================================================ */

packageCards.forEach(
  (card) => {

    card.addEventListener(
      "click",
      () => {

        packageCards.forEach(
          (item) =>
            item.classList.remove("active")
        );

        card.classList.add("active");

        selectedPackage =
          card.dataset.package;

        selectedCoins =
          Number(card.dataset.coins);

        selectedPrice =
          card.dataset.price;

        selectedCoinsText.textContent =
          `${selectedCoins.toLocaleString()} Coins`;

        selectedPriceText.textContent =
          `$${selectedPrice} USD`;

      }
    );

  }
);


/* ============================================================
   GET LOGGED-IN SESSION
============================================================ */

async function loadSession() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();

  if (error) {

    showStatus(
      "Unable to load your Zynora session."
    );

    return false;
  }

  currentSession =
    data.session;

  if (!currentSession) {

    loginWarning.style.display =
      "block";

    showStatus(
      "You are not logged in. Log in to Zynora before purchasing coins."
    );

    return false;
  }

  loginWarning.style.display =
    "none";

  return true;
}


/* ============================================================
   LOAD REAL COIN BALANCE
============================================================ */

async function loadBalance() {

  if (!currentSession) {
    return;
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from("wallets")
      .select("balance")
      .eq(
        "user_id",
        currentSession.user.id
      )
      .single();

  if (error) {

    console.error(
      "Wallet load error:",
      error
    );

    balanceValue.textContent =
      "0";

    return;
  }

  balanceValue.textContent =
    Number(data.balance)
      .toLocaleString();

}


/* ============================================================
   CREATE PAYPAL ORDER
============================================================ */

async function createOrder() {

  const sessionLoaded =
    await loadSession();

  if (!sessionLoaded) {

    throw new Error(
      "You must be logged in."
    );
  }

  showStatus(
    "Creating secure PayPal order..."
  );

  const response =
    await fetch(
      FUNCTION_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json",

          "Authorization":
            `Bearer ${currentSession.access_token}`
        },

        body:
          JSON.stringify(
            {
              action:
                "create-order",

              packageId:
                selectedPackage
            }
          )
      }
    );

  const data =
    await response.json();

  if (!response.ok) {

    showStatus(data);

    throw new Error(
      data.error ||
      "Unable to create PayPal order."
    );
  }

  showStatus({
    message:
      "PayPal order created.",
    orderId:
      data.orderId,
    coins:
      data.coins,
    amount:
      data.amount
  });

  return data.orderId;

}


/* ============================================================
   CAPTURE PAYMENT + CREDIT WALLET
============================================================ */

async function captureOrder(
  orderId
) {

  const sessionLoaded =
    await loadSession();

  if (!sessionLoaded) {

    throw new Error(
      "Your Zynora login session expired."
    );
  }

  showStatus(
    "Payment approved. Verifying and adding coins..."
  );

  const response =
    await fetch(
      FUNCTION_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json",

          "Authorization":
            `Bearer ${currentSession.access_token}`
        },

        body:
          JSON.stringify(
            {
              action:
                "capture-order",

              orderId:
                orderId
            }
          )
      }
    );

  const data =
    await response.json();

  if (!response.ok) {

    showStatus(data);

    throw new Error(
      data.error ||
      "Payment verification failed."
    );
  }

  if (
    !data.paymentCompleted
  ) {

    throw new Error(
      "PayPal payment did not complete."
    );
  }

  if (
    data.newBalance !== null &&
    data.newBalance !== undefined
  ) {

    balanceValue.textContent =
      Number(
        data.newBalance
      ).toLocaleString();

  } else {

    await loadBalance();

  }

  return data;

}


/* ============================================================
   PAYPAL BUTTON
============================================================ */

if (
  typeof paypal === "undefined"
) {

  showStatus(
    "PayPal SDK failed to load."
  );

} else {

  paypal.Buttons({

    style: {
      layout:
        "vertical",

      shape:
        "rect",

      label:
        "paypal"
    },


    createOrder:
      async function() {

        return await createOrder();

      },


    onApprove:
      async function(data) {

        try {

          const result =
            await captureOrder(
              data.orderID
            );

          showStatus({
            message:
              "PAYMENT COMPLETED ✅",

            coinsAdded:
              result.credited
                ? result.coins
                : 0,

            balance:
              result.newBalance,

            paymentStatus:
              result.status,

            captureId:
              result.captureId
          });

          alert(
            result.credited
              ? `${result.coins} Zynora Coins added successfully!`
              : "Payment already credited previously."
          );

        } catch (error) {

          showStatus({
            message:
              "Payment error",
            error:
              error.message
          });

        }

      },


    onCancel:
      function(data) {

        showStatus({
          message:
            "Payment cancelled.",
          orderId:
            data.orderID || null
        });

      },


    onError:
      function(error) {

        showStatus({
          message:
            "PayPal checkout error.",
          error:
            error?.message ||
            String(error)
        });

      }

  })
  .render(
    "#paypal-button-container"
  );

}


/* ============================================================
   START PAGE
============================================================ */

async function startPage() {

  const loggedIn =
    await loadSession();

  if (!loggedIn) {
    return;
  }

  await loadBalance();

  showStatus(
    "Your Zynora wallet is ready. Choose a coin package and pay securely with PayPal."
  );

}


startPage();

</script>

</body>
</html>
