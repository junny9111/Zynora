<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zynora Coins</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script
    src="https://www.paypal.com/sdk/js?client-id=BAAkUqT2hoXnVB9x48eX60l-_lxVKQkiwSJY61jaN_D1Icg5bOGmE5mcmuN_H6LhhCaqHGOWoJvZEQSDM4&currency=USD&intent=capture">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #35124d, #08080e 55%);
      color: white;
      font-family: Arial, sans-serif;
      padding: 22px;
    }

    .page {
      max-width: 620px;
      margin: auto;
    }

    .logo {
      text-align: center;
      font-size: 48px;
      font-weight: 900;
      margin: 15px 0 5px;
      background: linear-gradient(
        90deg,
        #ffffff,
        #e76bff,
        #922cff
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #bfb9ca;
      margin-bottom: 25px;
    }

    .wallet {
      background: #11111a;
      border: 1px solid rgba(215, 79, 255, .35);
      border-radius: 25px;
      padding: 24px;
      text-align: center;
      margin-bottom: 25px;
    }

    .wallet-title {
      color: #aaa5b4;
      font-size: 14px;
    }

    #balance {
      margin-top: 6px;
      font-size: 42px;
      font-weight: 900;
      color: #dd61ff;
    }

    .packages {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .package {
      padding: 22px 12px;
      border-radius: 22px;
      background: #11111a;
      border: 2px solid transparent;
      text-align: center;
      cursor: pointer;
    }

    .package.active {
      border-color: #d84dff;
      box-shadow: 0 0 20px rgba(211, 73, 255, .18);
    }

    .coin-number {
      color: #dd61ff;
      font-size: 27px;
      font-weight: 900;
    }

    .price {
      margin-top: 7px;
      color: #d1cbd7;
      font-size: 18px;
    }

    .selected {
      margin-top: 22px;
      padding: 18px;
      text-align: center;
      background: #101018;
      border-radius: 19px;
      color: #c9c4cf;
    }

    .selected strong {
      color: #e064ff;
    }

    #buyButton {
      width: 100%;
      margin-top: 22px;
      padding: 19px;

      border: none;
      border-radius: 18px;

      background:
        linear-gradient(
          90deg,
          #b12cff,
          #e54dff
        );

      color: white;

      font-size: 19px;
      font-weight: 900;

      cursor: pointer;
    }

    #buyButton:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    #paypalSection {
      margin-top: 25px;
      padding: 20px;
      border-radius: 22px;
      background: #11111a;
      display: none;
    }

    .paypal-title {
      text-align: center;
      margin-bottom: 15px;
      color: #d1cad9;
    }

    #status {
      margin-top: 22px;
      border-radius: 18px;
      background: #0c0c12;
      padding: 17px;
      color: #c8c4cf;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }

    #loginBox {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 20px;
      background: #26131f;
      text-align: center;
    }

    #loginBox a {
      display: inline-block;
      margin-top: 12px;
      color: #df5cff;
      font-weight: bold;
      text-decoration: none;
    }

    @media(max-width: 500px) {
      .packages {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div class="logo">Zynora</div>

  <div class="subtitle">
    Purchase coins securely
  </div>


  <div class="wallet">

    <div class="wallet-title">
      YOUR ZYNORA COINS
    </div>

    <div id="balance">
      0
    </div>

  </div>


  <div class="packages">

    <div
      class="package active"
      data-package="coins_250"
      data-coins="250"
      data-price="4.99">

      <div class="coin-number">
        🪙 250
      </div>

      <div class="price">
        $4.99
      </div>

    </div>


    <div
      class="package"
      data-package="coins_500"
      data-coins="500"
      data-price="9.99">

      <div class="coin-number">
        🪙 500
      </div>

      <div class="price">
        $9.99
      </div>

    </div>


    <div
      class="package"
      data-package="coins_1200"
      data-coins="1200"
      data-price="19.99">

      <div class="coin-number">
        🪙 1,200
      </div>

      <div class="price">
        $19.99
      </div>

    </div>


    <div
      class="package"
      data-package="coins_3000"
      data-coins="3000"
      data-price="29.99">

      <div class="coin-number">
        🪙 3,000
      </div>

      <div class="price">
        $29.99
      </div>

    </div>

  </div>


  <div class="selected">

    You selected

    <strong id="selectedText">
      250 Coins
    </strong>

    for

    <strong id="priceText">
      $4.99 USD
    </strong>

  </div>


  <button id="buyButton">
    BUY 250 COINS — $4.99
  </button>


  <div id="paypalSection">

    <div class="paypal-title">
      Choose your payment method
    </div>

    <div id="paypal-button-container"></div>

  </div>


  <div id="loginBox">

    You must be logged into Zynora
    before purchasing coins.

    <br>

    <a href="login.html">
      LOGIN TO ZYNORA
    </a>

  </div>


  <div id="status">
    Loading Zynora wallet...
  </div>

</div>


<script>

const SUPABASE_URL =
"https://ozshekxpuvganemaajms.supabase.co";

const SUPABASE_KEY =
"sb_publishable__GsW9RahFD_XDWJTFzh9eQ_dNBZfa32";

const FUNCTION_URL =
"https://ozshekxpuvganemaajms.supabase.co/functions/v1/zynora-paypal";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let session = null;

let selectedPackage =
"coins_250";

let selectedCoins =
250;

let selectedPrice =
"4.99";

let paypalRendered =
false;


const balance =
document.getElementById("balance");

const selectedText =
document.getElementById("selectedText");

const priceText =
document.getElementById("priceText");

const buyButton =
document.getElementById("buyButton");

const paypalSection =
document.getElementById("paypalSection");

const status =
document.getElementById("status");

const loginBox =
document.getElementById("loginBox");


function showStatus(message) {

  if (typeof message === "string") {

    status.textContent =
    message;

  } else {

    status.textContent =
    JSON.stringify(
      message,
      null,
      2
    );

  }

}


/* ======================================
   PACKAGE SELECTION
====================================== */

document
.querySelectorAll(".package")
.forEach(card => {

  card.addEventListener(
    "click",
    () => {

      document
      .querySelectorAll(".package")
      .forEach(item => {
        item.classList.remove("active");
      });


      card.classList.add("active");


      selectedPackage =
      card.dataset.package;


      selectedCoins =
      Number(
        card.dataset.coins
      );


      selectedPrice =
      card.dataset.price;


      selectedText.textContent =
      selectedCoins.toLocaleString()
      + " Coins";


      priceText.textContent =
      "$" +
      selectedPrice +
      " USD";


      buyButton.textContent =
      "BUY " +
      selectedCoins.toLocaleString() +
      " COINS — $" +
      selectedPrice;


      paypalSection.style.display =
      "none";

  });

});


/* ======================================
   LOAD LOGIN
====================================== */

async function loadSession() {

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();


  if (error) {

    showStatus(
      "Could not load Zynora login."
    );

    return false;

  }


  session =
  data.session;


  if (!session) {

    buyButton.disabled =
    true;

    loginBox.style.display =
    "block";


    showStatus(
      "Please log into Zynora first."
    );

    return false;

  }


  buyButton.disabled =
  false;


  loginBox.style.display =
  "none";


  return true;

}


/* ======================================
   LOAD WALLET
====================================== */

async function loadBalance() {

  if (!session) {
    return;
  }


  const {
    data,
    error
  } =
  await supabaseClient
  .from("wallets")
  .select("balance")
  .eq(
    "user_id",
    session.user.id
  )
  .single();


  if (error) {

    console.error(error);

    balance.textContent =
    "0";

    return;

  }


  balance.textContent =
  Number(
    data.balance
  ).toLocaleString();

}


/* ======================================
   CREATE PAYPAL ORDER
====================================== */

async function createOrder() {

  const valid =
  await loadSession();


  if (!valid) {

    throw new Error(
      "Please log into Zynora."
    );

  }


  showStatus(
    "Creating secure PayPal order..."
  );


  const response =
  await fetch(
    FUNCTION_URL,
    {

      method:
      "POST",

      headers: {

        "Content-Type":
        "application/json",

        "Authorization":
        `Bearer ${session.access_token}`

      },

      body:
      JSON.stringify({

        action:
        "create-order",

        packageId:
        selectedPackage

      })

    }
  );


  const data =
  await response.json();


  if (!response.ok) {

    showStatus(data);

    throw new Error(
      data.error ||
      "Unable to create PayPal order."
    );

  }


  return data.orderId;

}


/* ======================================
   CAPTURE PAYMENT
====================================== */

async function captureOrder(orderId) {

  await loadSession();


  showStatus(
    "Payment approved. Adding your Zynora Coins..."
  );


  const response =
  await fetch(
    FUNCTION_URL,
    {

      method:
      "POST",

      headers: {

        "Content-Type":
        "application/json",

        "Authorization":
        `Bearer ${session.access_token}`

      },

      body:
      JSON.stringify({

        action:
        "capture-order",

        orderId:
        orderId

      })

    }
  );


  const data =
  await response.json();


  if (!response.ok) {

    showStatus(data);

    throw new Error(
      data.error ||
      "Payment verification failed."
    );

  }


  if (
    data.newBalance !== null &&
    data.newBalance !== undefined
  ) {

    balance.textContent =
    Number(
      data.newBalance
    ).toLocaleString();

  } else {

    await loadBalance();

  }


  return data;

}


/* ======================================
   PAYPAL
====================================== */

function renderPayPal() {

  if (paypalRendered) {
    return;
  }


  if (
    typeof paypal ===
    "undefined"
  ) {

    showStatus(
      "PayPal failed to load."
    );

    return;

  }


  paypal.Buttons({

    style: {

      layout:
      "vertical",

      shape:
      "rect",

      label:
      "paypal"

    },


    createOrder:
    async function() {

      return await createOrder();

    },


    onApprove:
    async function(data) {

      try {

        const result =
        await captureOrder(
          data.orderID
        );


        showStatus({

          message:
          "COINS PURCHASED SUCCESSFULLY ✅",

          coinsAdded:
          result.credited
          ? result.coins
          : 0,

          newBalance:
          result.newBalance,

          paymentStatus:
          result.status,

          captureId:
          result.captureId

        });


        if (
          result.credited
        ) {

          alert(
            result.coins +
            " Zynora Coins have been added to your account!"
          );

        } else {

          alert(
            "This payment was already credited."
          );

        }


        paypalSection.style.display =
        "none";

      }

      catch(error) {

        showStatus({
          error:
          error.message
        });

      }

    },


    onCancel:
    function() {

      showStatus(
        "Payment cancelled."
      );

    },


    onError:
    function(error) {

      showStatus({

        message:
        "PayPal payment error.",

        error:
        error?.message ||
        String(error)

      });

    }

  })
  .render(
    "#paypal-button-container"
  );


  paypalRendered =
  true;

}


/* ======================================
   BUY COINS BUTTON
====================================== */

buyButton.addEventListener(
  "click",
  async () => {

    const loggedIn =
    await loadSession();


    if (!loggedIn) {
      return;
    }


    paypalSection.style.display =
    "block";


    renderPayPal();


    paypalSection.scrollIntoView({
      behavior:
      "smooth"
    });


    showStatus(
      "Choose PayPal or Debit/Credit Card to complete your coin purchase."
    );

  }
);


/* ======================================
   START
====================================== */

async function start() {

  const loggedIn =
  await loadSession();


  if (!loggedIn) {
    return;
  }


  await loadBalance();


  showStatus(
    "Your Zynora wallet is ready."
  );

}


start();

</script>

</body>
</html>
