<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Zynora Library</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap"
rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 8%,
            rgba(145,55,255,.18),
            transparent 32%
        ),
        #08070c;

    color: white;

    font-family:
        "Playfair Display",
        Georgia,
        serif;

    padding-bottom: 105px;
}


/* HEADER */

header {
    height: 95px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 22px;

    background: #111016;

    border-bottom:
        1px solid
        rgba(173,77,255,.25);
}


.logo {
    font-family:
        "Cinzel",
        serif;

    font-size: 37px;

    font-weight: 700;

    letter-spacing: -2px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #d19aff,
            #8e38ff
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}


.coin-top {
    padding: 10px 14px;

    border-radius: 18px;

    background:
        rgba(130,45,220,.16);

    border:
        1px solid
        rgba(173,77,255,.25);

    color: #ffd75c;

    font-family:
        "Cinzel",
        serif;

    font-size: 13px;
}


/* MAIN */

main {
    max-width: 650px;

    margin: auto;

    padding: 28px 20px;
}


.title {
    font-family:
        "Cinzel",
        serif;

    font-size: 31px;
}


.subtitle {
    margin-top: 7px;

    color: #9994a2;

    font-style: italic;

    margin-bottom: 25px;
}


/* TABS */

.tabs {
    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 8px;

    padding: 5px;

    background: #121117;

    border-radius: 18px;

    border:
        1px solid
        rgba(255,255,255,.07);

    margin-bottom: 26px;
}


.tab {
    padding: 12px 6px;

    border: none;

    border-radius: 14px;

    background: transparent;

    color: #777582;

    font-family:
        "Cinzel",
        serif;

    font-size: 11px;
}


.tab.active {
    background:
        linear-gradient(
            135deg,
            #a84fff,
            #7521e4
        );

    color: white;
}


/* PANELS */

.panel {
    display: none;
}


.panel.active {
    display: block;
}


/* EMPTY STATE */

.empty {
    background:
        linear-gradient(
            145deg,
            #15141b,
            #101016
        );

    border:
        1px solid
        rgba(173,77,255,.18);

    border-radius: 24px;

    padding: 48px 24px;

    text-align: center;
}


.empty-icon {
    width: 82px;
    height: 82px;

    margin: 0 auto 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #a84fff,
            #7521e4
        );

    font-size: 33px;

    box-shadow:
        0 0 30px
        rgba(145,50,255,.35);
}


.empty h2 {
    font-family:
        "Cinzel",
        serif;

    font-size: 20px;

    margin-bottom: 11px;
}


.empty p {
    color: #9994a2;

    line-height: 1.6;

    font-size: 14px;

    max-width: 320px;

    margin: auto;
}


.browse {
    display: inline-block;

    margin-top: 23px;

    padding: 14px 22px;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #a84fff,
            #7521e4
        );

    color: white;

    text-decoration: none;

    font-family:
        "Cinzel",
        serif;

    font-size: 13px;
}


/* EPISODE CARD */

.episode-card {
    display: flex;

    gap: 14px;

    padding: 15px;

    margin-bottom: 13px;

    border-radius: 19px;

    background: #15141b;

    border:
        1px solid
        rgba(255,255,255,.07);
}


.poster {
    width: 80px;
    height: 105px;

    flex: 0 0 80px;

    border-radius: 13px;

    background:
        linear-gradient(
            145deg,
            #a84fff,
            #24102f
        );
}


.episode-content {
    flex: 1;
}


.episode-title {
    font-family:
        "Cinzel",
        serif;

    font-size: 14px;

    margin-bottom: 7px;
}


.episode-info {
    color: #918c98;

    font-size: 12px;
}


.watch-btn {
    display: inline-block;

    margin-top: 12px;

    padding: 9px 15px;

    border-radius: 12px;

    background:
        rgba(155,60,245,.18);

    border:
        1px solid
        rgba(173,77,255,.35);

    color: #d3a4ff;

    text-decoration: none;

    font-family:
        "Cinzel",
        serif;

    font-size: 10px;
}


/* NAV */

.bottom-nav {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 90px;

    background:
        rgba(17,16,22,.98);

    border-top:
        1px solid
        rgba(173,77,255,.2);

    display: grid;

    grid-template-columns:
        repeat(5,1fr);

    z-index: 50;
}


.nav-item {
    text-decoration: none;

    color: #777582;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 5px;

    font-family:
        "Cinzel",
        serif;

    font-size: 9px;
}


.nav-icon {
    font-size: 21px;
}


.nav-item.active {
    color: #a94dff;

    text-shadow:
        0 0 15px
        rgba(169,77,255,.5);
}

</style>

</head>


<body>


<header>

<div class="logo">
Zynora
</div>

<div class="coin-top">
🪙 <span id="coinDisplay">0</span>
</div>

</header>


<main>

<h1 class="title">
My Library
</h1>

<p class="subtitle">
Your saved dramas, history and unlocked episodes.
</p>


<!-- TABS -->

<div class="tabs">

<button
class="tab active"
onclick="openTab('saved', this)">

Saved

</button>


<button
class="tab"
onclick="openTab('history', this)">

History

</button>


<button
class="tab"
onclick="openTab('unlocked', this)">

Unlocked

</button>

</div>


<!-- SAVED -->

<section
id="saved"
class="panel active">

<div class="empty">

<div class="empty-icon">
♡
</div>

<h2>
No saved dramas yet
</h2>

<p>
Tap the save button on a Zynora drama and it will appear here.
</p>

<a
href="discover.html"
class="browse">

Discover Dramas

</a>

</div>

</section>


<!-- HISTORY -->

<section
id="history"
class="panel">

<div class="episode-card">

<div class="poster"></div>

<div class="episode-content">

<div class="episode-title">
The Billionaire's Secret
</div>

<div class="episode-info">
Episode
