<!DOCTYPE html>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
background:
radial-gradient(circle at 50% 8%,rgba(145,55,255,.18),transparent 32%),
#08070c;
color:white;
font-family:"Playfair Display",Georgia,serif;
padding-bottom:110px;
}

header{
height:95px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 22px;
background:#111016;
border-bottom:1px solid rgba(173,77,255,.25);
position:sticky;
top:0;
z-index:20;
}

.logo{
font-family:"Cinzel",serif;
font-size:37px;
font-weight:700;
letter-spacing:-2px;
background:linear-gradient(90deg,#fff,#d19aff,#8e38ff);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
}

.coin-top{
padding:10px 14px;
border-radius:18px;
background:rgba(130,45,220,.16);
border:1px solid rgba(173,77,255,.25);
color:#ffd75c;
font-family:"Cinzel",serif;
font-size:13px;
}

main{
max-width:650px;
margin:auto;
padding:28px 20px;
}

h1{
font-family:"Cinzel",serif;
font-size:31px;
}

.subtitle{
margin:7px 0 25px;
color:#9994a2;
font-style:italic;
}

.tabs{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
padding:5px;
background:#121117;
border-radius:18px;
margin-bottom:26px;
border:1px solid rgba(255,255,255,.03);
}

.tab{
padding:12px 6px;
border:0;
border-radius:14px;
background:transparent;
color:#777582;
font-family:"Cinzel",serif;
cursor:pointer;
transition:.2s ease;
}

.tab.active{
background:linear-gradient(135deg,#a84fff,#7521e4);
color:white;
box-shadow:0 6px 18px rgba(132,39,222,.25);
}

.panel{
display:none;
}

.panel.active{
display:block;
}

.card{
display:flex;
gap:14px;
padding:15px;
margin-bottom:13px;
border-radius:19px;
background:#15141b;
border:1px solid rgba(255,255,255,.07);
box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.poster{
width:80px;
height:105px;
flex:0 0 80px;
border-radius:13px;
background:
linear-gradient(145deg,rgba(168,79,255,.85),rgba(36,16,47,.95));
background-size:cover;
background-position:center;
border:1px solid rgba(255,255,255,.06);
}

.content{
flex:1;
min-width:0;
}

.title2{
font-family:"Cinzel",serif;
font-size:14px;
margin-bottom:7px;
line-height:1.35;
}

.info{
color:#918c98;
font-size:12px;
line-height:1.5;
}

.action-row{
display:flex;
align-items:center;
gap:8px;
margin-top:12px;
flex-wrap:wrap;
}

.action{
display:inline-block;
padding:9px 14px;
border-radius:12px;
background:rgba(155,60,245,.18);
border:1px solid rgba(173,77,255,.35);
color:#d3a4ff;
text-decoration:none;
font-family:"Cinzel",serif;
font-size:10px;
}

.action:hover{
background:rgba(155,60,245,.28);
}

.remove-btn{
padding:9px 12px;
border-radius:12px;
background:rgba(255,75,100,.08);
border:1px solid rgba(255,90,110,.2);
color:#d58c99;
font-family:"Cinzel",serif;
font-size:9px;
cursor:pointer;
}

.empty{
padding:45px 22px;
text-align:center;
background:#121117;
border-radius:24px;
border:1px solid rgba(173,77,255,.18);
color:#9994a2;
}

.empty h2{
font-family:"Cinzel",serif;
color:white;
margin-bottom:10px;
font-size:18px;
}

.empty p{
line-height:1.55;
font-size:14px;
}

.loading{
padding:35px 20px;
text-align:center;
color:#938b9d;
font-style:italic;
}


/* ========================================
   ZYNORA MASTER 6-BUTTON NAVIGATION
======================================== */

.bottom-nav{
position:fixed;
left:0;
right:0;
bottom:0;
height:90px;
background:rgba(17,16,22,.98);
display:grid;
grid-template-columns:repeat(6,1fr);
border-top:1px solid rgba(173,77,255,.2);
z-index:100;
backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
}

.nav-item{
text-decoration:none;
color:#777582;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:5px;
font-family:"Cinzel",serif;
font-size:8px;
transition:.2s ease;
min-width:0;
}

.nav-icon-wrap{
width:37px;
height:37px;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
transition:.2s ease;
}

.nav-icon-wrap svg{
width:22px;
height:22px;
fill:none;
stroke:currentColor;
stroke-width:1.9;
stroke-linecap:round;
stroke-linejoin:round;
}

.nav-item.active{
color:#b45cff;
text-shadow:0 0 15px rgba(169,77,255,.5);
}

.nav-item.active .nav-icon-wrap{
background:linear-gradient(
135deg,
rgba(169,77,255,.28),
rgba(116,27,232,.18)
);
box-shadow:
0 0 0 1px rgba(169,77,255,.32),
0 0 18px rgba(169,77,255,.24);
}

.nav-item:active{
transform:scale(.96);
}

@media(max-width:400px){

.logo{
font-size:31px;
}

main{
padding-left:15px;
padding-right:15px;
}

.card{
padding:12px;
}

.poster{
width:72px;
height:98px;
flex-basis:72px;
}

.nav-item{
font-size:7px;
}

.nav-icon-wrap{
width:35px;
height:35px;
}

.nav-icon-wrap svg{
width:21px;
height:21px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">Zynora</div>

<div class="coin-top">
🪙 <span id="coins">0</span>
</div>

</header>

<main>

<h1>My Library</h1>

<p class="subtitle">
Your saved dramas, watch history and unlocked episodes.
</p>

<div class="tabs">

<button id="savedTab" class="tab active">
Saved
</button>

<button id="historyTab" class="tab">
History
</button>

<button id="unlockedTab" class="tab">
Unlocked
</button>

</div>

<div id="savedPanel" class="panel active">
<div class="loading">Loading saved dramas...</div>
</div>

<div id="historyPanel" class="panel">
<div class="loading">Loading watch history...</div>
</div>

<div id="unlockedPanel" class="panel">
<div class="loading">Loading unlocked episodes...</div>
</div>

</main>


<!-- ========================================
     MASTER 6-BUTTON ZYNORA NAVIGATION
========================================= -->

<nav class="bottom-nav">

<!-- HOME -->

<a href="index.html" class="nav-item">

Profile

<script>

const client = supabase.createClient(
"https://ozshekxpuvganemaajms.supabase.co",
"sb_publishable__GsW9RahFD_XDWJTFzh9eQ_dNBZfa32"
);

let user = null;

const savedTab = document.getElementById("savedTab");
const historyTab = document.getElementById("historyTab");
const unlockedTab = document.getElementById("unlockedTab");

const savedPanel = document.getElementById("savedPanel");
const historyPanel = document.getElementById("historyPanel");
const unlockedPanel = document.getElementById("unlockedPanel");


/* ========================================
   TABS
======================================== */

function showPanel(panel,button){

document.querySelectorAll(".panel").forEach(panelItem=>{
panelItem.classList.remove("active");
});

document.querySelectorAll(".tab").forEach(tabItem=>{
tabItem.classList.remove("active");
});

panel.classList.add("active");
button.classList.add("active");

}

savedTab.onclick=()=>{
showPanel(savedPanel,savedTab);
};

historyTab.onclick=()=>{
showPanel(historyPanel,historyTab);
};

unlockedTab.onclick=()=>{
showPanel(unlockedPanel,unlockedTab);
};


/* ========================================
   SAFE TEXT
======================================== */

function escapeHTML(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* ========================================
   PLAYER URL
======================================== */

function makePlayerURL(dramaId,dramaTitle,episodeNumber){

const params = new URLSearchParams();

if(dramaId){
params.set("drama_id",dramaId);
}

if(dramaTitle){
params.set("drama",dramaTitle);
}

if(episodeNumber){
params.set("episode",episodeNumber);
}

return "player.html?" + params.toString();

}


/* ========================================
   POSTER
======================================== */

function posterStyle(url){

if(!url){
return "";
}

return `style="background-image:url('${escapeHTML(url)}')"`;

}


/* ========================================
   START
======================================== */

async function start(){

const {
data:{
user:currentUser
},
error
} = await client.auth.getUser();

if(error){

console.error("Authentication error:",error);

}

user=currentUser;

if(!user){

const loginMessage=`
<div class="empty">
<h2>Please log in</h2>
<p>Your Zynora Library is connected to your account.</p>
</div>
`;

savedPanel.innerHTML=loginMessage;
historyPanel.innerHTML=loginMessage;
unlockedPanel.innerHTML=loginMessage;

document.getElementById("coins").textContent="0";

return;

}

await Promise.all([
loadCoins(),
loadSaved(),
loadHistory(),
loadUnlocked()
]);

}


/* ========================================
   WALLET
======================================== */

async function loadCoins(){

const result=await client
.from("wallets")
.select("balance")
.eq("user_id",user.id)
.maybeSingle();

if(result.error){

console.error("Wallet error:",result.error);

document.getElementById("coins").textContent="0";

return;

}

if(result.data){

document.getElementById("coins").textContent=
Number(result.data.balance || 0).toLocaleString();

}else{

document.getElementById("coins").textContent="0";

}

}


/* ========================================
   SAVED
======================================== */

async function loadSaved(){

savedPanel.innerHTML=
'<div class="loading">Loading saved dramas...</div>';

const result=await client
.from("saved_dramas")
.select("*")
.eq("user_id",user.id)
.order("created_at",{ascending:false});

if(result.error){

console.error("Saved dramas error:",result.error);

savedPanel.innerHTML=`
<div class="empty">
<h2>Unable to load Saved</h2>
<p>${escapeHTML(result.error.message)}</p>
</div>
`;

return;

}

if(!result.data || !result.data.length){

savedPanel.innerHTML=`
<div class="empty">
<h2>No saved dramas yet</h2>
<p>Save a drama from Discover and it will appear here.</p>
</div>
`;

return;

}

savedPanel.innerHTML="";

result.data.forEach(item=>{

const title=
item.drama_title ||
item.title ||
"Zynora Drama";

const dramaId=
item.drama_id ||
"";

const episode=
item.episode_number ||
item.last_episode ||
1;

const poster=
item.poster_url ||
item.image_url ||
item.thumbnail_url ||
"";

const recordId=item.id;

const watchURL=
makePlayerURL(
dramaId,
title,
episode
);

savedPanel.innerHTML+=`

<div class="card">

<div class="poster" ${posterStyle(poster)}></div>

<div class="content">

<div class="title2">
${escapeHTML(title)}
</div>

<div class="info">
Saved to your Zynora Library
</div>

<div class="action-row">

<a
class="action"
href="${watchURL}">
▶ Watch
</a>

${
recordId
?
`<button
class="remove-btn"
onclick="removeSaved('${escapeHTML(recordId)}')">
Remove
</button>`
:
""
}

</div>

</div>

</div>

`;

});

}


/* ========================================
   REMOVE SAVED
======================================== */

async function removeSaved(id){

if(!user || !id){
return;
}

const confirmed=confirm(
"Remove this drama from your Saved Library?"
);

if(!confirmed){
return;
}

const result=await client
.from("saved_dramas")
.delete()
.eq("id",id)
.eq("user_id",user.id);

if(result.error){

alert(
"Unable to remove drama: " +
result.error.message
);

return;

}

await loadSaved();

}


/* ========================================
   HISTORY
======================================== */

async function loadHistory(){

historyPanel.innerHTML=
'<div class="loading">Loading watch history...</div>';

const result=await client
.from("watch_history")
.select("*")
.eq("user_id",user.id)
.order("watched_at",{ascending:false});

if(result.error){

console.error("History error:",result.error);

historyPanel.innerHTML=`
<div class="empty">
<h2>Unable to load History</h2>
<p>${escapeHTML(result.error.message)}</p>
</div>
`;

return;

}

if(!result.data || !result.data.length){

historyPanel.innerHTML=`
<div class="empty">
<h2>No watch history yet</h2>
<p>Your watched episodes will appear here automatically.</p>
</div>
`;

return;

}

historyPanel.innerHTML="";

result.data.forEach(item=>{

const title=
item.drama_title ||
item.title ||
"Zynora Drama";

const dramaId=
item.drama_id ||
"";

const episode=
item.episode_number ||
1;

const poster=
item.poster_url ||
item.image_url ||
item.thumbnail_url ||
"";

const progress=
Number(
item.progress_percent ??
item.progress ??
0
);

let infoText=
`Episode ${escapeHTML(episode)}`;

if(progress > 0){

infoText+=
` · ${Math.min(100,Math.round(progress))}% watched`;

}

const continueURL=
makePlayerURL(
dramaId,
title,
episode
);

historyPanel.innerHTML+=`

<div class="card">

<div class="poster" ${posterStyle(poster)}></div>

<div class="content">

<div class="title2">
${escapeHTML(title)}
</div>

<div class="info">
${infoText}
</div>

<div class="action-row">

<a
class="action"
href="${continueURL}">
▶ Continue
</a>

</div>

</div>

</div>

`;

});

}


/* ========================================
   UNLOCKED
======================================== */

async function loadUnlocked(){

unlockedPanel.innerHTML=
'<div class="loading">Loading unlocked episodes...</div>';

const unlockResult=await client
.from("unlocked_episodes")
.select("id,episode_id,unlocked_at")
.eq("user_id",user.id)
.order("unlocked_at",{ascending:false});

if(unlockResult.error){

console.error(
"Unlocked episodes error:",
unlockResult.error
);

unlockedPanel.innerHTML=`
<div class="empty">
<h2>Unable to load Unlocked</h2>
<p>${escapeHTML(unlockResult.error.message)}</p>
</div>
`;

return;

}

const unlocked=
unlockResult.data || [];

if(!unlocked.length){

unlockedPanel.innerHTML=`
<div class="empty">

<h2>No unlocked episodes yet</h2>

<p>
Episodes purchased with Zynora Coins or unlocked through rewards will appear here.
</p>

</div>
`;

return;

}


/* COLLECT EPISODE IDS */

const episodeIds=[
...new Set(
unlocked
.map(item=>item.episode_id)
.filter(Boolean)
)
];

if(!episodeIds.length){

unlockedPanel.innerHTML=`
<div class="empty">
<h2>No episode information found</h2>
<p>Your unlocked episode records do not contain episode IDs.</p>
</div>
`;

return;

}


/* LOAD EPISODE INFORMATION */

const episodeResult=await client
.from("episodes")
.select("*")
.in("id",episodeIds);

if(episodeResult.error){

console.error(
"Episode information error:",
episodeResult.error
);

unlockedPanel.innerHTML=`
<div class="empty">
<h2>Unable to load episode information</h2>
<p>${escapeHTML(episodeResult.error.message)}</p>
</div>
`;

return;

}


const episodeMap=new Map();

(episodeResult.data || []).forEach(
episode=>{

episodeMap.set(
episode.id,
episode
);

}
);


unlockedPanel.innerHTML="";


unlocked.forEach(unlock=>{

const item=
episodeMap.get(
unlock.episode_id
);

if(!item){
return;
}

const title=
item.drama_title ||
item.series_title ||
"Zynora Drama";

const dramaId=
item.drama_id ||
"";

const episode=
item.episode_number ||
1;

const poster=
item.thumbnail_url ||
"";

const watchURL=
makePlayerURL(
dramaId,
title,
episode
);

unlockedPanel.innerHTML+=`

<div class="card">

<div
class="poster"
${posterStyle(poster)}>
</div>

<div class="content">

<div class="title2">
${escapeHTML(title)}
</div>

<div class="info">
Episode ${escapeHTML(episode)} · Unlocked
</div>

<div class="action-row">

<a
class="action"
href="${watchURL}">
▶ Watch Episode
</a>

</div>

</div>

</div>

`;

});


if(!unlockedPanel.innerHTML.trim()){

unlockedPanel.innerHTML=`
<div class="empty">
<h2>No episode information found</h2>
<p>The unlocked records could not be matched to episodes.</p>
</div>
`;

}

}


/* ========================================
   REFRESH
======================================== */

document.addEventListener(
"visibilitychange",
async()=>{

if(
document.visibilityState==="visible" &&
user
){

await Promise.all([
loadCoins(),
loadSaved(),
loadHistory(),
loadUnlocked()
]);

}

}
);


window.addEventListener(
"pageshow",
async()=>{

if(user){

await Promise.all([
loadCoins(),
loadSaved(),
loadHistory(),
loadUnlocked()
]);

}

}
);


start();

</script>

</body>
</html>
