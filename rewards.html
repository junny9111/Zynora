<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zynora Rewards</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #321248 0%, #12051f 38%, #08080d 72%);
      color: white;
      font-family: Georgia, "Times New Roman", serif;
      padding-bottom: 110px;
    }

    .topbar {
      padding: 34px 26px 24px;
      border-bottom: 1px solid rgba(173, 70, 255, 0.25);
      background: #0d0d13;
    }

    .logo {
      font-size: 46px;
      font-weight: 700;
      letter-spacing: -2px;
      background: linear-gradient(90deg, #fff, #e989ff, #8d2cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .page {
      max-width: 700px;
      margin: 0 auto;
      padding: 42px 24px;
    }

    h1 {
      margin: 0;
      font-size: 48px;
      text-transform: uppercase;
    }

    .subtitle {
      color: #b0a8b9;
      font-size: 20px;
      margin-top: 20px;
      margin-bottom: 34px;
    }

    .message {
      display: none;
      padding: 18px;
      border-radius: 20px;
      margin-bottom: 28px;
      background: #18131e;
      border: 1px solid rgba(220, 85, 255, 0.3);
      text-align: center;
      font-size: 17px;
      line-height: 1.5;
    }

    .wallet-card {
      padding: 28px;
      border-radius: 34px;
      background:
        radial-gradient(circle at left, rgba(186, 37, 255, 0.55), transparent 55%),
        linear-gradient(135deg, #7d19ce, #321048);
      border: 2px solid rgba(222, 100, 255, 0.75);
      box-shadow: 0 0 34px rgba(150, 26, 255, 0.2);
      margin-bottom: 28px;
    }

    .wallet-label {
      font-size: 18px;
      color: #efe5f4;
      text-transform: uppercase;
    }

    .wallet-balance {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 14px;
    }

    .coin {
      font-size: 56px;
    }

    #balance {
      font-size: 66px;
      line-height: 1;
    }

    .buy-button {
      width: 100%;
      border: none;
      border-radius: 20px;
      padding: 19px 20px;
      margin-bottom: 38px;
      font-family: inherit;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      color: white;
      background: linear-gradient(90deg, #8a20df, #d943ff);
      box-shadow: 0 8px 24px rgba(174, 46, 255, 0.25);
    }

    .section-title {
      font-size: 30px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .reward-card {
      background: #131219;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 28px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .reward-top {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .reward-icon {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #281143;
      font-size: 38px;
      flex-shrink: 0;
    }

    .reward-name {
      font-size: 27px;
    }

    .reward-description {
      margin-top: 8px;
      color: #aaa4ae;
      font-size: 18px;
      line-height: 1.4;
    }

    .claim-button {
      width: 100%;
      margin-top: 22px;
      border: 0;
      border-radius: 18px;
      padding: 17px;
      background: linear-gradient(90deg, #8f21df, #d648ff);
      color: white;
      font-family: inherit;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
    }

    .claim-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .login-box {
      display: none;
      margin-top: 25px;
      padding: 22px;
      text-align: center;
      border-radius: 22px;
      background: #21131f;
      border: 1px solid rgba(255, 92, 168, 0.35);
    }

    .login-box a {
      display: inline-block;
      margin-top: 12px;
      color: #df63ff;
      font-weight: 700;
      text-decoration: none;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 92px;
      background: #101016;
      border-top: 1px solid rgba(177, 74, 255, 0.3);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 10;
    }

    .nav-item {
      color: #77717f;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 14px;
    }

    .nav-icon {
      font-size: 24px;
    }

    .nav-item.active {
      color: #c74dff;
    }

    @media (max-width: 520px) {
      h1 {
        font-size: 42px;
      }

      .wallet-card {
        padding: 24px;
      }

      #balance {
        font-size: 58px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="logo">ZYNORA</div>
  </header>

  <main class="page">

    <h1>Rewards</h1>

    <div class="subtitle">
      Earn Zynora Coins and unlock episodes.
    </div>

    <div id="message" class="message"></div>

    <section class="wallet-card">
      <div class="wallet-label">
        Your Zynora Coins
      </div>

      <div class="wallet-balance">
        <div class="coin">🪙</div>
        <div id="balance">0</div>
      </div>
    </section>

    <button id="buyCoinsButton" class="buy-button">
      BUY ZYNORA COINS
    </button>

    <div class="section-title">
      Available Rewards
    </div>

    <section class="reward-card">

      <div class="reward-top">

        <div class="reward-icon">
          🎁
        </div>

        <div>
          <div class="reward-name">
            Daily Check-In
          </div>

          <div class="reward-description">
            Claim 20 coins once every day.
          </div>
        </div>

      </div>

      <button id="claimDailyButton" class="claim-button">
        CLAIM 20 COINS
      </button>

    </section>

    <div id="loginBox" class="login-box">
      You must be logged into Zynora to use Rewards.
      <br />
      <a href="login.html">LOGIN TO ZYNORA</a>
    </div>

  </main>

  <nav class="bottom-nav">

    <a class="nav-item" href="index.html">
      <div class="nav-icon">⌂</div>
      <div>HOME</div>
    </a>

    <a class="nav-item" href="discover.html">
      <div class="nav-icon">◉</div>
      <div>DISCOVER</div>
    </a>

    <a class="nav-item active" href="rewards.html">
      <div class="nav-icon">🎁</div>
      <div>REWARDS</div>
    </a>

    <a class="nav-item" href="library.html">
      <div class="nav-icon">▣</div>
      <div>LIBRARY</div>
    </a>

    <a class="nav-item" href="profile.html">
      <div class="nav-icon">●</div>
      <div>PROFILE</div>
    </a>

  </nav>


<script>

const SUPABASE_URL =
  "https://ozshekxpuvganemaajms.supabase.co";

const SUPABASE_KEY =
  "sb_publishable__GsW9RahFD_XDWJTFzh9eQ_dNBZfa32";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentSession = null;


const balance =
  document.getElementById("balance");

const message =
  document.getElementById("message");

const loginBox =
  document.getElementById("loginBox");

const claimDailyButton =
  document.getElementById("claimDailyButton");

const buyCoinsButton =
  document.getElementById("buyCoinsButton");


function showMessage(text) {

  message.style.display =
    "block";

  message.textContent =
    text;

}


function hideMessage() {

  message.style.display =
    "none";

}


/* ============================================================
   LOAD ZYNORA LOGIN SESSION
============================================================ */

async function loadSession() {

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();


  if (error) {

    console.error(error);

    showMessage(
      "Unable to load your Zynora account."
    );

    return false;
  }


  currentSession =
    data.session;


  if (!currentSession) {

    loginBox.style.display =
      "block";

    claimDailyButton.disabled =
      true;

    buyCoinsButton.disabled =
      true;

    showMessage(
      "Please log into Zynora to use Rewards."
    );

    return false;
  }


  loginBox.style.display =
    "none";

  claimDailyButton.disabled =
    false;

  buyCoinsButton.disabled =
    false;


  return true;

}


/* ============================================================
   LOAD REAL WALLET BALANCE
============================================================ */

async function loadBalance() {

  if (!currentSession) {
    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("wallets")
      .select("balance")
      .eq(
        "user_id",
        currentSession.user.id
      )
      .single();


  if (error) {

    console.error(
      "Wallet load error:",
      error
    );

    showMessage(
      "Unable to load your Zynora coin balance."
    );

    return;
  }


  balance.textContent =
    Number(
      data.balance
    ).toLocaleString();

}


/* ============================================================
   CLAIM SECURE DAILY REWARD
============================================================ */

async function claimDailyReward() {

  const loggedIn =
    await loadSession();


  if (!loggedIn) {
    return;
  }


  claimDailyButton.disabled =
    true;

  claimDailyButton.textContent =
    "CLAIMING...";


  hideMessage();


  const {
    data,
    error
  } =
    await supabaseClient
      .rpc(
        "claim_daily_reward"
      );


  if (error) {

    console.error(
      "Daily reward error:",
      error
    );

    showMessage(
      error.message ||
      "Unable to claim daily reward."
    );

    claimDailyButton.disabled =
      false;

    claimDailyButton.textContent =
      "CLAIM 20 COINS";

    return;
  }


  const result =
    Array.isArray(data)
      ? data[0]
      : data;


  if (!result) {

    showMessage(
      "Zynora could not process the reward."
    );

    claimDailyButton.disabled =
      false;

    claimDailyButton.textContent =
      "CLAIM 20 COINS";

    return;
  }


  if (
    result.new_balance !==
      null &&
    result.new_balance !==
      undefined
  ) {

    balance.textContent =
      Number(
        result.new_balance
      ).toLocaleString();

  } else {

    await loadBalance();

  }


  if (
    result.already_claimed
  ) {

    showMessage(
      "You already claimed today's 20-coin reward. Come back tomorrow."
    );

    claimDailyButton.textContent =
      "CLAIMED TODAY";

    claimDailyButton.disabled =
      true;

    return;
  }


  showMessage(
    "20 Zynora Coins added to your account successfully!"
  );


  claimDailyButton.textContent =
    "CLAIMED TODAY";

  claimDailyButton.disabled =
    true;

}


/* ============================================================
   BUY COINS
============================================================ */

buyCoinsButton.addEventListener(
  "click",
  async () => {

    const loggedIn =
      await loadSession();


    if (!loggedIn) {
      return;
    }


    window.location.href =
      "buy-coins.html";

  }
);


/* ============================================================
   DAILY BUTTON
============================================================ */

claimDailyButton.addEventListener(
  "click",
  claimDailyReward
);


/* ============================================================
   START PAGE
============================================================ */

async function startRewardsPage() {

  const loggedIn =
    await loadSession();


  if (!loggedIn) {
    return;
  }


  await loadBalance();


  hideMessage();

}


startRewardsPage();

</script>

</body>
</html>
