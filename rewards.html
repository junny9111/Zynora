<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zynora Rewards</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% 5%, rgba(145,55,255,.22), transparent 35%),
    #08070c;
  color: white;
  font-family: "Playfair Display", Georgia, serif;
  padding-bottom: 105px;
}

header {
  height: 90px;
  display: flex;
  align-items: center;
  padding: 0 22px;
  background: #111016;
  border-bottom: 1px solid rgba(173,77,255,.25);
}

.logo {
  font-family: "Cinzel", serif;
  font-size: 37px;
  font-weight: 700;
  letter-spacing: -2px;
  background: linear-gradient(90deg,#fff,#d19aff,#8e38ff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

main {
  max-width: 600px;
  margin: auto;
  padding: 28px 20px;
}

h1 {
  font-family: "Cinzel", serif;
  font-size: 31px;
}

.subtitle {
  color: #9994a2;
  margin: 7px 0 25px;
  font-style: italic;
}

.wallet {
  padding: 25px;
  border-radius: 24px;
  background: linear-gradient(135deg,#6e20bd,#301052);
  border: 1px solid rgba(205,145,255,.45);
  margin-bottom: 30px;
  box-shadow: 0 0 40px rgba(130,40,220,.28);
}

.wallet-label {
  color: #ddd0e9;
  font-size: 13px;
}

.balance {
  font-family: "Cinzel", serif;
  font-size: 40px;
  margin-top: 8px;
}

.section-title {
  font-family: "Cinzel", serif;
  font-size: 19px;
  margin-bottom: 15px;
}

.reward {
  background: #15141b;
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 20px;
  padding: 19px;
  margin-bottom: 14px;
}

.reward-head {
  display: flex;
  align-items: center;
  gap: 14px;
}

.reward-icon {
  width: 48px;
  height: 48px;
  border-radius: 15px;
  background: rgba(150,60,240,.18);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}

.reward-name {
  font-family: "Cinzel", serif;
  font-size: 15px;
}

.reward-description {
  color: #97929f;
  font-size: 13px;
  margin-top: 5px;
  line-height: 1.4;
}

.reward-btn {
  display: block;
  width: 100%;
  margin-top: 16px;
  padding: 14px;
  border: 0;
  border-radius: 14px;
  background: linear-gradient(135deg,#a84fff,#7521e4);
  color: white;
  font-family: "Cinzel", serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

.reward-btn:disabled {
  background: #292631;
  color: #77737f;
  cursor: not-allowed;
}

.hidden {
  display: none !important;
}

#status {
  margin: 15px 0 22px;
  padding: 13px;
  border-radius: 13px;
  background: #17131e;
  border: 1px solid rgba(173,77,255,.2);
  color: #c9c3d0;
  display: none;
  text-align: center;
}

.history {
  margin-top: 30px;
}

.history-row {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  padding: 13px 0;
  border-bottom: 1px solid rgba(255,255,255,.07);
}

.history-amount {
  color: #ffd75c;
  font-family: "Cinzel", serif;
  white-space: nowrap;
}


/* MINI GAME */

.game-box {
  margin-top: 16px;
  padding: 18px;
  border-radius: 16px;
  background: #0e0d13;
  border: 1px solid rgba(173,77,255,.25);
  display: none;
}

.game-box.show {
  display: block;
}

.game-title {
  font-family: "Cinzel", serif;
  text-align: center;
  margin-bottom: 8px;
}

.game-text {
  color: #aaa3b2;
  text-align: center;
  font-size: 13px;
  margin-bottom: 15px;
}

.game-score {
  text-align: center;
  font-family: "Cinzel", serif;
  margin-bottom: 14px;
  color: #d5a7ff;
}

.game-area {

  height: 220px;
