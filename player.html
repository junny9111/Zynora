<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zynora Player</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:
  radial-gradient(circle at 50% 8%,rgba(145,55,255,.18),transparent 34%),
  #08070c;
  color:white;
  font-family:"Playfair Display",Georgia,serif;
  padding-bottom:100px;
}

header{
  height:92px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:#111016;
  border-bottom:1px solid rgba(173,77,255,.25);
}

.logo{
  font-family:"Cinzel",serif;
  font-size:35px;
  font-weight:700;
  letter-spacing:-2px;
  background:linear-gradient(90deg,#fff,#d19aff,#8e38ff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.back{
  color:white;
  text-decoration:none;
  font-size:28px;
}

main{
  max-width:760px;
  margin:auto;
  padding:22px 18px 120px;
}

.player{
  background:#000;
  border-radius:22px;
  overflow:hidden;
  border:1px solid rgba(173,77,255,.25);
  box-shadow:0 0 35px rgba(120,35,220,.18);
  position:relative;
}

video{
  width:100%;
  display:block;
  background:black;
  min-height:200px;
}

.player-empty{
  min-height:210px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
  color:#8f8998;
}

.title{
  font-family:"Cinzel",serif;
  font-size:28px;
  margin-top:22px;
}

.meta{
  color:#9994a2;
  margin-top:7px;
  font-style:italic;
}

.wallet-row{
  margin-top:20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.wallet-box{
  padding:14px 16px;
  border-radius:18px;
  background:rgba(130,45,220,.15);
  border:1px solid rgba(173,77,255,.25);
}

.wallet-label{
  font-size:11px;
  color:#9a95a2;
}

.wallet-value{
  margin-top:5px;
  font-family:"Cinzel",serif;
  font-size:17px;
}

.coins{
  color:#ffd75c;
}

.ads{
  color:#d29cff;
}

.auth-message{
  margin-top:16px;
  padding:13px 15px;
  border-radius:14px;
  background:#18131f;
  border:1px solid rgba(173,77,255,.2);
  color:#bbb4c5;
  display:none;
}

.auth-message a{
  color:#d29cff;
  font-weight:700;
}

.section-title{
  font-family:"Cinzel",serif;
  font-size:21px;
  margin:28px 0 14px;
}

.episode-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.episode{
  background:#15141b;
  border:1px solid rgba(255,255,255,.07);
  border-radius:18px;
  padding:16px;
  transition:.2s ease;
}

.episode.playing{
  border-color:rgba(173,77,255,.7);
  box-shadow:0 0 20px rgba(130,45,220,.15);
}

.episode-top{
  display:flex;
  align-items:center;
  gap:14px;
}

.ep-number{
  width:52px;
  height:52px;
  border-radius:15px;
  background:rgba(150,60,240,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Cinzel",serif;
  font-size:13px;
  flex-shrink:0;
}

.ep-info{
  flex:1;
}

.ep-title{
  font-family:"Cinzel",serif;
  font-size:14px;
}

.ep-cost{
  color:#9a95a2;
  font-size:12px;
  margin-top:5px;
}

.free-label{
  color:#8cffb3;
}

.locked-label{
  color:#d1c8da;
}

.action-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.action{
  border:0;
  border-radius:12px;
  padding:12px 8px;
  font-family:"Cinzel",serif;
  font-size:10px;
  font-weight:600;
  cursor:pointer;
}

.action:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.watch-btn{
  background:linear-gradient(135deg,#a84fff,#7521e4);
  color:white;
  grid-column:1 / -1;
}

.coin-btn{
  background:#241b2e;
  color:#ffd75c;
  border:1px solid rgba(255,215,92,.2);
}

.ad-btn{
  background:#21172c;
  color:#d39cff;
  border:1px solid rgba(173,77,255,.3);
}

#message{
  margin-top:18px;
  padding:13px;
  border-radius:14px;
  background:#17131e;
  border:1px solid rgba(173,77,255,.2);
  color:#c9c3d0;
  display:none;
  text-align:center;
}

#message.success{
  color:#aaffc3;
  border-color:rgba(70,220,120,.35);
}

#message.error{
  color:#ffb0ba;
  border-color:rgba(255,75,100,.35);
}

.loading{
  text-align:center;
  padding:25px;
  color:#98919f;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:90px;
  background:#111016;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  border-top:1px solid rgba(173,77,255,.2);
  z-index:50;
}

.nav-item{
  text-decoration:none;
  color:#777582;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-family:"Cinzel",serif;
  font-size:9px;
}

.nav-icon{
  font-size:21px;
}

@media(max-width:520px){

  header{
    height:80px;
  }

  .logo{
    font-size:29px;
  }

  .title{
    font-size:23px;
  }

}

</style>
</head>

<body>

<header>

<a href="discover.html" class="back">‹</a>

<div class="logo">
Zynora
</div>

</header>

<main>

<div class="player">

<video
id="videoPlayer"
controls
playsinline
preload="metadata"
style="display:none;">

<source
id="videoSource"
src=""
type="video/mp4">

</video>

<div
id="playerEmpty"
class="player-empty">

Select an unlocked episode below to begin watching.

</div>

</div>

<h1
class="title"
id="dramaTitle">

Loading drama...

</h1>

<div
class="meta"
id="episodeMeta">

Select an episode below

</div>

<div class="wallet-row">

<div class="wallet-box">

<div class="wallet-label">
ZYNORA COINS
</div>

<div class="wallet-value coins">

🪙
<span id="coinBalance">
0
</span>

</div>

</div>

<div class="wallet-box">

<div class="wallet-label">
AD UNLOCKS LEFT TODAY
</div>

<div class="wallet-value ads">

📺
<span id="adRemaining">
20
</span>

</div>

</div>

</div>

<div
id="authMessage"
class="auth-message">

Please
<a href="login.html">log in</a>
to unlock paid episodes and save your progress.

</div>

<div id="message"></div>

<h2 class="section-title">
Episodes
</h2>

<div
id="episodeList"
class="episode-list">

<div class="loading">
Loading episodes...
</div>

</div>

</main>

<nav class="bottom-nav">

<a href="index.html" class="nav-item">
<span class="nav-icon">⌂</span>
Home
</a>

<a href="discover.html" class="nav-item">
<span class="nav-icon">◉</span>
Discover
</a>

<a href="rewards.html" class="nav-item">
<span class="nav-icon">🎁</span>
Rewards
</a>

<a href="library.html" class="nav-item">
<span class="nav-icon">▣</span>
Library
</a>

<a href="profile.html" class="nav-item">
<span class="nav-icon">●</span>
Profile
</a>

</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const client =
supabase.createClient(
  "https://ozshekxpuvganemaajms.supabase.co",
  "sb_publishable__GsW9RahFD_XDWJTFzh9eQ_dNBZfa32"
);

let user = null;
let episodes = [];
let unlockedIds = new Set();
let currentEpisodeId = null;

const dramaId =
localStorage.getItem("zynoraCurrentDramaId")
|| "billionaire-secret";

const dramaTitle =
localStorage.getItem("zynoraCurrentDramaTitle")
|| "The Billionaire's Secret";

document
.getElementById("dramaTitle")
.textContent =
dramaTitle;


/* =========================
   START
========================= */

async function start(){

  try{

    const auth =
    await client.auth.getUser();

    user =
    auth?.data?.user || null;

    if(!user){

      document
      .getElementById("authMessage")
      .style.display =
      "block";

    }

    await loadEpisodes();

    if(user){

      await Promise.all([
        loadCoins(),
        loadUnlocked(),
        loadRemainingAds()
      ]);

    }

    renderEpisodes();

  }

  catch(error){

    showMessage(
      "Player could not start: " +
      error.message,
      "error"
    );

  }

}


/* =========================
   LOAD EPISODES
========================= */

async function loadEpisodes(){

  const result =
  await client
  .from("episodes")
  .select("*")
  .eq(
    "drama_id",
    dramaId
  )
  .order(
    "episode_number",
    {ascending:true}
  );

  if(result.error){

    showMessage(
      result.error.message,
      "error"
    );

    episodes = [];

    return;

  }

  episodes =
  result.data || [];

}


/* =========================
   LOAD COINS
========================= */

async function loadCoins(){

  const result =
  await client
  .from("coin_wallets")
  .select("balance")
  .eq(
    "user_id",
    user.id
  )
  .maybeSingle();

  if(result.error){

    console.error(
      "Wallet error:",
      result.error
    );

    return;

  }

  document
  .getElementById("coinBalance")
  .textContent =
  Number(result.data?.balance || 0);

}


/* =========================
   LOAD UNLOCKED EPISODES
========================= */

async function loadUnlocked(){

  unlockedIds.clear();

  const result =
  await client
  .from("unlocked_episodes")
  .select("episode_id")
  .eq(
    "user_id",
    user.id
  );

  if(result.error){

    console.error(
      "Unlocked episodes error:",
      result.error
    );

    return;

  }

  (result.data || [])
  .forEach(function(item){

    unlockedIds.add(
      item.episode_id
    );

  });

}


/* =========================
   ADS REMAINING
========================= */

async function loadRemainingAds(){

  const result =
  await client.rpc(
    "get_remaining_ad_unlocks"
  );

  if(result.error){

    console.warn(
      "Ad count error:",
      result.error
    );

    return;

  }

  const remaining =
  Number(result.data ?? 20);

  document
  .getElementById("adRemaining")
  .textContent =
  Math.max(
    0,
    remaining
  );

}


/* =========================
   IS EPISODE UNLOCKED
========================= */

function episodeIsUnlocked(ep){

  return (
    ep.is_free === true
    ||
    Number(ep.coin_cost || 0) === 0
    ||
    unlockedIds.has(ep.id)
  );

}


/* =========================
   RENDER EPISODES
========================= */

function renderEpisodes(){

  const list =
  document.getElementById(
    "episodeList"
  );

  list.innerHTML = "";

  if(!episodes.length){

    list.innerHTML =
    '<div class="loading">No episodes are available for this drama yet.</div>';

    return;

  }

  episodes.forEach(function(ep){

    const isUnlocked =
    episodeIsUnlocked(ep);

    const container =
    document.createElement("div");

    container.className =
    "episode";

    container.dataset.episodeId =
    ep.id;

    if(
      currentEpisodeId === ep.id
    ){

      container.classList.add(
        "playing"
      );

    }


    const top =
    document.createElement("div");

    top.className =
    "episode-top";


    const number =
    document.createElement("div");

    number.className =
    "ep-number";

    number.textContent =
    "EP " +
    ep.episode_number;


    const info =
    document.createElement("div");

    info.className =
    "ep-info";


    const title =
    document.createElement("div");

    title.className =
    "ep-title";

    title.textContent =
    ep.episode_title
    ||
    (
      "Episode " +
      ep.episode_number
    );


    const cost =
    document.createElement("div");

    cost.className =
    "ep-cost";


    if(isUnlocked){

      cost.textContent =
      ep.is_free ||
      Number(ep.coin_cost || 0) === 0
      ? "Free • Unlocked"
      : "Unlocked";

      cost.classList.add(
        "free-label"
      );

    }

    else{

      cost.textContent =
      "Locked • 🪙 " +
      Number(ep.coin_cost || 0) +
      " or 1 rewarded ad";

      cost.classList.add(
        "locked-label"
      );

    }


    info.appendChild(
      title
    );

    info.appendChild(
      cost
    );

    top.appendChild(
      number
    );

    top.appendChild(
      info
    );

    container.appendChild(
      top
    );


    const actions =
    document.createElement("div");

    actions.className =
    "action-row";


    if(isUnlocked){

      const watch =
      document.createElement(
        "button"
      );

      watch.className =
      "action watch-btn";

      watch.textContent =
      currentEpisodeId === ep.id
      ? "▶ Playing"
      : "▶ Watch Episode";

      watch.onclick =
      function(){

        playEpisode(ep);

      };

      actions.appendChild(
        watch
      );

    }

    else{

      const coin =
      document.createElement(
        "button"
      );

      coin.className =
      "action coin-btn";

      coin.textContent =
      "🪙 " +
      Number(ep.coin_cost || 0) +
      " Coins";

      coin.onclick =
      function(){

        unlockWithCoins(
          ep,
          coin
        );

      };


      const ad =
      document.createElement(
        "button"
      );

      ad.className =
      "action ad-btn";

      ad.textContent =
      "📺 Watch Ad";

      ad.onclick =
      function(){

        unlockWithAd(
          ep,
          ad
        );

      };


      actions.appendChild(
        coin
      );

      actions.appendChild(
        ad
      );

    }


    container.appendChild(
      actions
    );

    list.appendChild(
      container
    );

  });

}


/* =========================
   UNLOCK WITH COINS
========================= */

async function unlockWithCoins(
  ep,
  button
){

  if(!user){

    showMessage(
      "Please log in before unlocking episodes.",
      "error"
    );

    return;

  }

  const balance =
  Number(
    document
    .getElementById("coinBalance")
    .textContent
  ) || 0;

  const cost =
  Number(ep.coin_cost || 0);

  if(balance < cost){

    showMessage(
      "You need " +
      cost +
      " coins to unlock this episode. Your balance is " +
      balance +
      ".",
      "error"
    );

    return;

  }

  button.disabled =
  true;

  button.textContent =
  "Unlocking...";


  const result =
  await client.rpc(
    "unlock_episode",
    {
      p_episode_id:
      ep.id
    }
  );


  if(result.error){

    showMessage(
      result.error.message,
      "error"
    );

    button.disabled =
    false;

    button.textContent =
    "🪙 " +
    cost +
    " Coins";

    return;

  }


  unlockedIds.add(
    ep.id
  );


  if(
    result.data !== null
    &&
    result.data !== undefined
  ){

    document
    .getElementById("coinBalance")
    .textContent =
    Number(result.data);

  }

  else{

    await loadCoins();

  }


  showMessage(
    "Episode " +
    ep.episode_number +
    " unlocked successfully.",
    "success"
  );


  renderEpisodes();

}


/* =========================
   REWARDED AD BUTTON
========================= */

async function unlockWithAd(
  ep,
  button
){

  if(!user){

    showMessage(
      "Please log in before using rewarded ads.",
      "error"
    );

    return;

  }


  const remaining =
  Number(
    document
    .getElementById("adRemaining")
    .textContent
  ) || 0;


  if(remaining <= 0){

    showMessage(
      "You have used all 20 rewarded-ad unlocks for today.",
      "error"
    );

    return;

  }


  /*
  IMPORTANT

  We do NOT unlock the episode here.

  This button is ready for the real
  rewarded-ad provider.

  Only after the provider confirms
  the user watched the complete ad
  should confirmRewardedAd() run.
  */


  button.disabled =
  true;

  button.textContent =
  "Ad unavailable";


  showMessage(
    "Rewarded ads will become available after Zynora's ad provider is approved and connected. No ad unlock was charged.",
    "error"
  );


  setTimeout(
    function(){

      button.disabled =
      false;

      button.textContent =
      "📺 Watch Ad";

    },
    1800
  );

}


/* =========================
   CONFIRM REAL AD COMPLETION
========================= */

async function confirmRewardedAd(
  episodeId,
  provider,
  eventId
){

  if(!user){

    showMessage(
      "Please log in first.",
      "error"
    );

    return;
  }


  if(
    !episodeId ||
    !provider ||
    !eventId
  ){

    showMessage(
      "Invalid rewarded-ad confirmation.",
      "error"
    );

    return;

  }


  const result =
  await client.rpc(
    "unlock_episode_with_ad",
    {

      p_episode_id:
      episodeId,

      p_ad_provider:
      provider,

      p_ad_event_id:
      eventId

    }
  );


  if(result.error){

    showMessage(
      result.error.message,
      "error"
    );

    return;

  }


  unlockedIds.add(
    episodeId
  );


  if(
    result.data !== null
    &&
    result.data !== undefined
  ){

    document
    .getElementById("adRemaining")
    .textContent =
    Number(result.data);

  }

  else{

    await loadRemainingAds();

  }


  showMessage(
    "Rewarded ad completed. Episode unlocked.",
    "success"
  );


  renderEpisodes();

}


/*
The future ad provider can call:

window.zynoraRewardedAdCompleted({
  episodeId: "EPISODE-ID",
  provider: "PROVIDER-NAME",
  eventId: "UNIQUE-AD-EVENT-ID"
});

*/

window.zynoraRewardedAdCompleted =
async function(data){

  if(!data){

    return;

  }

  await confirmRewardedAd(
    data.episodeId,
    data.provider,
    data.eventId
  );

};


/* =========================
   PLAY EPISODE
========================= */

async function playEpisode(ep){

  if(
    !episodeIsUnlocked(ep)
  ){

    showMessage(
      "This episode is still locked.",
      "error"
    );

    return;

  }


  if(!ep.video_url){

    showMessage(
      "This episode does not have a video uploaded yet.",
      "error"
    );

    return;

  }


  const source =
  document.getElementById(
    "videoSource"
  );

  const player =
  document.getElementById(
    "videoPlayer"
  );

  const empty =
  document.getElementById(
    "playerEmpty"
  );


  source.src =
  ep.video_url;

  player.style.display =
  "block";

  empty.style.display =
  "none";

  player.load();


  currentEpisodeId =
  ep.id;


  document
  .getElementById("episodeMeta")
  .textContent =
  "Episode " +
  ep.episode_number +
  " • " +
  (
    ep.episode_title ||
    "Zynora"
  );


  renderEpisodes();


  player.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });


  try{

    await player.play();

  }

  catch(error){

    console.log(
      "Browser waiting for play interaction."
    );

  }


  if(user){

    const historyData = {

      user_id:
      user.id,

      drama_id:
      ep.drama_id,

      drama_title:
      ep.drama_title
      ||
      dramaTitle,

      episode_number:
      ep.episode_number

    };


    const historyResult =
    await client
    .from("watch_history")
    .insert(
      historyData
    );


    if(historyResult.error){

      console.warn(
        "Watch history:",
        historyResult.error
      );

    }

  }

}


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  type = ""
){

  const box =
  document.getElementById(
    "message"
  );

  box.textContent =
  text;

  box.className =
  "";

  if(type){

    box.classList.add(
      type
    );

  }

  box.style.display =
  "block";


  clearTimeout(
    window.zynoraPlayerTimer
  );


  window.zynoraPlayerTimer =
  setTimeout(
    function(){

      box.style.display =
      "none";

    },
    4200
  );

}


start();

</script>

</body>
</html>
