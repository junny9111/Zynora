<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const client = supabase.createClient(
"https://ozshekxpuvganemaajms.supabase.co",
"sb_publishable__GsW9RahFD_XDWJTFzh9eQ_dNBZfa32"
);

let user = null;
let episodes = [];
let unlockedIds = new Set();

const dramaId =
localStorage.getItem("zynoraCurrentDramaId")
|| "billionaire-secret";

const dramaTitle =
localStorage.getItem("zynoraCurrentDramaTitle")
|| "The Billionaire's Secret";

document.getElementById("dramaTitle").textContent = dramaTitle;

async function start(){

const auth = await client.auth.getUser();
user = auth.data.user;

await loadEpisodes();

if(user){
await loadCoins();
await loadUnlocked();
}

renderEpisodes();

}

async function loadEpisodes(){

const result = await client
.from("episodes")
.select("*")
.eq("drama_id",dramaId)
.order("episode_number",{ascending:true});

if(result.error){
showMessage(result.error.message);
return;
}

episodes = result.data || [];

}

async function loadCoins(){

const result = await client
.from("coin_wallets")
.select("balance")
.eq("user_id",user.id)
.maybeSingle();

if(result.data){
document.getElementById("coinBalance").textContent =
result.data.balance;
}

}
