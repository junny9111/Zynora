<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zynora Player</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
background:
radial-gradient(circle at 50% 8%,rgba(145,55,255,.18),transparent 34%),
#08070c;
color:white;
font-family:"Playfair Display",Georgia,serif;
padding-bottom:100px;
}

header{
height:92px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
background:#111016;
border-bottom:1px solid rgba(173,77,255,.25);
}

.logo{
font-family:"Cinzel",serif;
font-size:35px;
font-weight:700;
letter-spacing:-2px;
background:linear-gradient(90deg,#fff,#d19aff,#8e38ff);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
}

.back{
color:white;
text-decoration:none;
font-size:28px;
}

main{
max-width:760px;
margin:auto;
padding:22px 18px 120px;
}

.player{
background:#000;
border-radius:22px;
overflow:hidden;
border:1px solid rgba(173,77,255,.25);
box-shadow:0 0 35px rgba(120,35,220,.18);
}

video{
width:100%;
display:block;
background:black;
}

.title{
font-family:"Cinzel",serif;
font-size:28px;
margin-top:22px;
}

.meta{
color:#9994a2;
margin-top:7px;
font-style:italic;
}

.wallet-row{
margin-top:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.wallet-box{
padding:14px 16px;
border-radius:18px;
background:rgba(130,45,220,.15);
border:1px solid rgba(173,77,255,.25);
}

.wallet-label{
font-size:11px;
color:#9a95a2;
}

.wallet-value{
margin-top:5px;
font-family:"Cinzel",serif;
font-size:17px;
}

.coins{
color:#ffd75c;
}

.ads{
color:#d29cff;
}

.section-title{
font-family:"Cinzel",serif;
font-size:21px;
margin:28px 0 14px;
}

.episode-list{
display:flex;
flex-direction:column;
gap:12px;
}

.episode{
background:#15141b;
border:1px solid rgba(255,255,255,.07);
border-radius:18px;
padding:16px;
}

.episode-top{
display:flex;
align-items:center;
gap:14px;
}

.ep-number{
width:52px;
height:52px;
border-radius:15px;
background:rgba(150,60,240,.18);
display:flex;
align-items:center;
justify-content:center;
font-family:"Cinzel",serif;
font-size:13px;
}

.ep-info{
flex:1;
}

.ep-title{
font-family:"Cinzel",serif;
font-size:14px;
}

.ep-cost{
color:#9a95a2;
font-size:12px;
margin-top:5px;
}

.action-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:14px;
}

.action{
border:0;
border-radius:12px;
padding:11px 8px;
font-family:"Cinzel",serif;
font-size:9px;
font-weight:600;
}

.watch-btn{
background:linear-gradient(135deg,#a84fff,#7521e4);
color:white;
grid-column:1 / -1;
}

.coin-btn{
background:#241b2e;
color:#ffd75c;
border:1px solid rgba(255,215,92,.2);
}

.ad-btn{
background:#21172c;
color:#d39cff;
border:1px solid rgba(173,77,255,.3);
}

#message{
margin-top:18px;
padding:13px;
border-radius:14px;
background:#17131e;
border:1px solid rgba(173,77,255,.2);
color:#c9c3d0;
display:none;
text-align:center;
}

.bottom-nav{
position:fixed;
left:0;
right:0;
bottom:0;
height:90px;
background:#111016;
display:grid;
grid-template-columns:repeat(5,1fr);
border-top:1px solid rgba(173,77,255,.2);
z-index:50;
}

.nav-item{
text-decoration:none;
color:#777582;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:5px;
font-family:"Cinzel",serif;
font-size:9px;
}

.nav-icon{
font-size:21px;
}

</style>
</head>

<body>

<header>

<a href="discover.html" class="back">‹</a>

<div class="logo">
Zynora
</div>

</header>

<main>

<div class="player">

<video
id="videoPlayer"
controls
playsinline>

<source
id="videoSource"
src=""
type="video/mp4">

</video>

</div>

<h1
class="title"
id="dramaTitle">

The Billionaire's Secret

</h1>

<div
class="meta"
id="episodeMeta">

Select an episode below

</div>

<div class="wallet-row">

<div class="wallet-box">

<div class="wallet-label">
ZYNORA COINS
</div>

<div class="wallet-value coins">

🪙
<span id="coinBalance">
0
</span>

</div>

</div>

<div class="wallet-box">

<div class="wallet-label">
AD UNLOCKS LEFT TODAY
</div>

<div class="wallet-value ads">

📺
<span id="adRemaining">
20
</span>

</div>

</div>

</div>

<div id="message"></div>

<h2 class="section-title">
Episodes
</h2>

<div
id="episodeList"
class="episode-list">

Loading episodes...

</div>

</main>

<nav class="bottom-nav">

<a href="index.html" class="nav-item">
<span class="nav-icon">⌂</span>
Home
</a>

<a href="discover.html" class="nav-item">
<span class="nav-icon">◉</span>
Discover
</a>

<a href="rewards.html" class="nav-item">
<span class="nav-icon">🎁</span>
Rewards
</a>

<a href="library.html" class="nav-item">
<span class="nav-icon">▣</span>
Library
</a>

<a href="profile.html" class="nav-item">
<span class="nav-icon">●</span>
Profile
</a>

</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const client =
supabase.createClient(
"https://ozshekxpuvganemaajms.supabase.co",
"sb_publishable__GsW9RahFD_XDWJTFzh9eQ_dNBZfa32"
);

let user = null;
let episodes = [];
let unlockedIds = new Set();

const dramaId =
localStorage.getItem(
"zynoraCurrentDramaId"
)
|| "billionaire-secret";

const dramaTitle =
localStorage.getItem(
"zynoraCurrentDramaTitle"
)
|| "The Billionaire's Secret";

document
.getElementById("dramaTitle")
.textContent =
dramaTitle;


/* START */

async function start(){

const auth =
await client.auth.getUser();

user =
auth.data.user;

await loadEpisodes();

if(user){

await loadCoins();

await loadUnlocked();

await loadRemainingAds();

}

renderEpisodes();

}


/* EPISODES */

async function loadEpisodes(){

const result =
await client
.from("episodes")
.select("*")
.eq(
"drama_id",
dramaId
)
.order(
"episode_number",
{ascending:true}
);

if(result.error){

showMessage(
result.error.message
);

return;

}

episodes =
result.data || [];

}


/* COINS */

async function loadCoins(){

const result =
await client
.from("coin_wallets")
.select("balance")
.eq(
"user_id",
user.id
)
.maybeSingle();

if(result.data){

document
.getElementById("coinBalance")
.textContent =
result.data.balance;

}

}


/* UNLOCKED */

async function loadUnlocked(){

const result =
await client
.from("unlocked_episodes")
.select("episode_id")
.eq(
"user_id",
user.id
);

if(result.data){

result.data
.forEach(function(item){

unlockedIds.add(
item.episode_id
);

});

}

}


/* ADS REMAINING */

async function loadRemainingAds(){

const result =
await client.rpc(
"get_remaining_ad_unlocks"
);

if(result.error){

showMessage(
result.error.message
);

return;

}

document
.getElementById("adRemaining")
.textContent =
result.data;

}


/* RENDER */

function renderEpisodes(){

const list =
document.getElementById(
"episodeList"
);

list.innerHTML = "";

if(!episodes.length){

list.textContent =
"No episodes found.";

return;

}

episodes.forEach(function(ep){

const container =
document.createElement("div");

container.className =
"episode";


const top =
document.createElement("div");

top.className =
"episode-top";


const number =
document.createElement("div");

number.className =
"ep-number";

number.textContent =
"EP " +
ep.episode_number;


const info =
document.createElement("div");

info.className =
"ep-info";


const title =
document.createElement("div");

title.className =
"ep-title";

title.textContent =
ep.episode_title ||
("Episode " + ep.episode_number);


const cost =
document.createElement("div");

cost.className =
"ep-cost";


const isUnlocked =
ep.is_free ||
ep.coin_cost === 0 ||
unlockedIds.has(ep.id);


cost.textContent =
isUnlocked
? "Unlocked"
: "Locked • 🪙 " +
ep.coin_cost +
" or 1 rewarded ad";


info.appendChild(title);

info.appendChild(cost);

top.appendChild(number);

top.appendChild(info);

container.appendChild(top);


const actions =
document.createElement("div");

actions.className =
"action-row";


if(isUnlocked){

const watch =
document.createElement("button");

watch.className =
"action watch-btn";

watch.textContent =
"▶ Watch Episode";

watch.onclick =
function(){

playEpisode(ep);

};

actions.appendChild(
watch
);

}

else{

const coin =
document.createElement("button");

coin.className =
"action coin-btn";

coin.textContent =
"🪙 " +
ep.coin_cost +
" Coins";

coin.onclick =
function(){

unlockWithCoins(
ep,
coin
);

};


const ad =
document.createElement("button");

ad.className =
"action ad-btn";

ad.textContent =
"📺 Watch Ad";

ad.onclick =
function(){

unlockWithAd(
ep,
ad
);

};


actions.appendChild(
coin
);

actions.appendChild(
ad
);

}


container.appendChild(
actions
);

list.appendChild(
container
);

});

}


/* COIN UNLOCK */

async function unlockWithCoins(
ep,
button
){

if(!user){

showMessage(
"Please log in first."
);

return;

}

button.disabled = true;

button.textContent =
"Processing...";


const result =
await client.rpc(
"unlock_episode",
{
p_episode_id:
ep.id
}
);


if(result.error){

showMessage(
result.error.message
);

button.disabled =
false;

button.textContent =
"🪙 " +
ep.coin_cost +
" Coins";

return;

}


unlockedIds.add(
ep.id
);


document
.getElementById("coinBalance")
.textContent =
result.data;


showMessage(
"Episode " +
ep.episode_number +
" unlocked with coins."
);


renderEpisodes();

}


/* AD UNLOCK */

async function unlockWithAd(
ep,
button
){

if(!user){

showMessage(
"Please log in first."
);

return;

}


/*
IMPORTANT:

A real ad provider still needs
to be connected here.

For now we DO NOT pretend an ad
was watched.

The secure database function
will only be called after the
real rewarded-ad completion event.
*/

showMessage(
"Rewarded ad provider is not connected yet. No episode was unlocked."
);

}


/* AFTER A REAL AD COMPLETES */

async function confirmRewardedAd(
episodeId,
provider,
eventId
){

const result =
await client.rpc(
"unlock_episode_with_ad",
{

p_episode_id:
episodeId,

p_ad_provider:
provider,

p_ad_event_id:
eventId

}
);


if(result.error){

showMessage(
result.error.message
);

return;

}


unlockedIds.add(
episodeId
);


document
.getElementById("adRemaining")
.textContent =
result.data;


showMessage(
"Episode unlocked with rewarded ad."
);


renderEpisodes();

}


/* PLAY */

async function playEpisode(ep){

const source =
document.getElementById(
"videoSource"
);

source.src =
ep.video_url || "";


const player =
document.getElementById(
"videoPlayer"
);


player.load();

player.play();


document
.getElementById("episodeMeta")
.textContent =
"Episode " +
ep.episode_number +
" • " +
(ep.episode_title || "");


if(user){

await client
.from("watch_history")
.insert({

user_id:
user.id,

drama_id:
ep.drama_id,

drama_title:
ep.drama_title,

episode_number:
ep.episode_number

});

}

}


/* MESSAGE */

function showMessage(text){

const box =
document.getElementById(
"message"
);

box.textContent =
text;

box.style.display =
"block";

clearTimeout(
window.zynoraPlayerTimer
);

window.zynoraPlayerTimer =
setTimeout(
function(){

box.style.display =
"none";

},
3200
);

}


start();

</script>

</body>
</html>
